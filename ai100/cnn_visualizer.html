<main class="shell">
  <div class="eyebrow">Convolutional Neural Networks</div>
  <h1>How does a CNN learn what to see?</h1>
  <p class="intro">Decompose a bicycle into visual clues, watch a set of filters specialize, and follow those clues as later layers assemble a prediction.</p>
  <nav class="chapter-bar" aria-label="Lesson chapters">
    <div class="chapter active" data-number="1" data-chapter="0">Observe</div>
    <div class="chapter" data-number="2" data-chapter="1">Specialize</div>
    <div class="chapter" data-number="3" data-chapter="2">Combine</div>
    <div class="chapter" data-number="4" data-chapter="3">Predict</div>
  </nav>
  <section class="story" aria-labelledby="sceneTitle">

    <div class="control-group"><button id="playBtn" type="button" aria-pressed="false">Play</button><button id="restartBtn" type="button">Restart</button></div>

 const f=filters[scene.filter];
 f.trainingRounds.forEach((round,roundIndex)=>{const base=roundIndex*3000;scheduleScene(()=>{$('#roundLabel').textContent=`Training round ${roundIndex+1} of 3`;$('#errorLabel').textContent=round.label;$('#errorFill').style.width=`${round.error}%`;$('#updateLegend').innerHTML='<span>Forward scan</span>';round.positions.forEach((position,i)=>scheduleScene(()=>showFilterPosition(f,round,position),180+i*155,epoch))},base+200,epoch);scheduleScene(()=>{$('#filterScanStatus').textContent=`Round ${roundIndex+1} · error travels backward`;flyFeedback($('.filter-output .map'),$('#filterSource'),epoch,f.color,'Error feedback',$('#kernelPanel'))},base+1050,epoch);scheduleScene(()=>{applyWeightEmphasis(f,round,scene);$('#filterScanStatus').textContent=`Round ${roundIndex+1} · weights adjust`;},base+1950,epoch);scheduleScene(()=>{$('#filterScanStatus').textContent=`Round ${roundIndex+1} · responses strengthen`;round.positions.filter(position=>f.hits.includes(position)).forEach(position=>{$$('.filter-output .map-cell')[position].style.setProperty('--strength',String(round.strength))})},base+2550,epoch)});
 let sweep=0;const finalSweep=()=>{if(epoch!==state.epoch)return;const f=filters[scene.filter];showFilterPosition(f,f.trainingRounds[2],sweep);sweep++;if(sweep<36)scheduleScene(finalSweep,38,epoch);else scheduleScene(()=>completeSceneAnimation(scene),350,epoch)};scheduleScene(()=>{$('#roundLabel').textContent='Final fast sweep';$('#filterScanStatus').textContent='Specialized filter · completing the feature map';finalSweep()},9250,epoch);
}
function animateStack(epoch){filters.forEach((filter,i)=>scheduleScene(()=>{$(`[data-stack="${i}"]`).classList.add('entered');$(`[data-channel="${i}"]`).classList.add('entered')},350+i*560,epoch));scheduleScene(()=>completeSceneAnimation(scenes[state.scene]),2800,epoch)}
function animateParts(epoch){const sequence=$$('.parts-flow > .feature-box,.parts-flow > .part-arrow');sequence.forEach((el,i)=>scheduleScene(()=>el.classList.add('entered'),300+i*430,epoch));scheduleScene(()=>completeSceneAnimation(scenes[state.scene]),3500,epoch)}
function runSceneAnimation(scene,epoch){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){completeSceneAnimation(scene);return}if(scene.kind==='pixels')animateShapeScan(epoch);if(scene.kind==='feedback')animateSharedFeedback(epoch);if(scene.kind==='filter')animateFilterTraining(scene,epoch);if(scene.kind==='stack')animateStack(epoch);if(scene.kind==='parts')animateParts(epoch)}
function animateSelectedSum(cell,row,col,epoch){const filter=shapeFilters[cell.dataset.filter],kernelRoot=$(`#${cell.dataset.filter}ShapeKernel`),finalValue=Number(cell.dataset.value);if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){cell.textContent=String(finalValue);$('#shapeScanReadout').textContent=`${filter.name} · nine products sum to activation ${finalValue}`;return}let termIndex=0,runningSum=0;cell.textContent='0';const step=()=>{if(epoch!==state.epoch)return;$$('#shapeInput .pixel').forEach(pixel=>pixel.classList.remove('pair-cell'));$$('#verticalShapeKernel .kernel-cell,#horizontalShapeKernel .kernel-cell').forEach(kernelCell=>kernelCell.classList.remove('pair-kernel'));const kr=Math.floor(termIndex/3),kc=termIndex%3,pixel=shapePixels[(row+kr)*9+col+kc],weight=filter.kernel[termIndex],product=pixel*weight;$('#shapeInput').children[(row+kr)*9+col+kc].classList.add('pair-cell');kernelRoot.querySelectorAll('.kernel-cell')[termIndex].classList.add('pair-kernel');runningSum+=product;cell.textContent=String(runningSum);cell.classList.remove('sum-pulse');void cell.offsetWidth;cell.classList.add('sum-pulse');$('#shapeScanReadout').textContent=`${filter.name} · product ${termIndex+1} of 9: ${pixel} × ${weight} = ${product} · running SUM ${runningSum}`;termIndex++;if(termIndex<9)scheduleScene(step,520,epoch);else scheduleScene(()=>{$$('#shapeInput .pixel').forEach(pixel=>pixel.classList.remove('pair-cell'));$$('#verticalShapeKernel .kernel-cell,#horizontalShapeKernel .kernel-cell').forEach(kernelCell=>kernelCell.classList.remove('pair-kernel'));cell.classList.remove('sum-pulse');cell.textContent=String(finalValue);$('#shapeScanReadout').textContent=`${filter.name} · SUM complete: activation ${finalValue}`},600,epoch)};scheduleScene(step,280,epoch)}
function selectShapeMapCell(cell){setPlaying(false);cancelSceneAnimations();completeSceneAnimation(scenes[state.scene]);const index=Number(cell.dataset.index),row=Math.floor(index/7),col=index%7;$$('#shapeInput .pixel').forEach(pixel=>pixel.classList.remove('selected-field'));$$('.shape-map .shape-cell').forEach(mapCell=>{mapCell.classList.remove('selected-cell','linked-cell');mapCell.setAttribute('aria-pressed','false')});for(let r=0;r<3;r++)for(let c=0;c<3;c++)$('#shapeInput').children[(row+r)*9+col+c].classList.add('selected-field');cell.classList.add('selected-cell');cell.setAttribute('aria-pressed','true');const otherFilter=cell.dataset.filter==='vertical'?'horizontal':'vertical',otherCell=$(`#${otherFilter}ShapeMap`).children[index];otherCell.classList.add('linked-cell');animateSelectedSum(cell,row,col,state.epoch)}
function bindShapeMapInteractions(){$$('.shape-map .shape-cell').forEach(cell=>{cell.setAttribute('aria-pressed','false');cell.addEventListener('click',()=>selectShapeMapCell(cell));cell.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();selectShapeMapCell(cell)}})})}

function renderScene(index,announce=true){
 cancelSceneAnimations();state.epoch++;clearTimeout(state.timer);state.timer=null;state.scene=Math.max(0,Math.min(scenes.length-1,index));
 const scene=scenes[state.scene];$('#sceneKicker').textContent=scene.kicker;$('#sceneTitle').textContent=scene.title;$('#sceneCopy').textContent=scene.copy;$('#sceneCount').textContent=`Scene ${state.scene+1} of ${scenes.length}`;
 const content=$('#sceneContent');content.classList.remove('scene-content');void content.offsetWidth;content.innerHTML=renderContent(scene);content.classList.add('scene-content');if(scene.kind==='pixels')bindShapeMapInteractions();
 $$('.chapter').forEach(el=>el.classList.toggle('active',Number(el.dataset.chapter)===scene.chapter));$('#prevBtn').disabled=state.scene===0;$('#nextBtn').disabled=state.scene===scenes.length-1;
 const pct=(state.scene+1)/scenes.length*100;$('#progressFill').style.width=`${pct}%`;$('.progress').setAttribute('aria-valuenow',String(state.scene+1));if(announce)$('#liveStatus').textContent=`Scene ${state.scene+1}: ${scene.title}. ${scene.copy}`;runSceneAnimation(scene,state.epoch);if(state.playing)scheduleNext();
}
function scheduleNext(){clearTimeout(state.timer);if(!state.playing)return;if(state.scene===scenes.length-1){setPlaying(false);return}state.timer=setTimeout(()=>renderScene(state.scene+1),scenes[state.scene].duration)}
function setPlaying(value){state.playing=value;clearTimeout(state.timer);state.timer=null;$('#playBtn').textContent=value?'Pause':'Play';$('#playBtn').setAttribute('aria-pressed',String(value));if(value)scheduleNext()}
function move(delta){setPlaying(false);renderScene(state.scene+delta)}
$('#prevBtn').addEventListener('click',()=>move(-1));$('#nextBtn').addEventListener('click',()=>move(1));$('#playBtn').addEventListener('click',()=>setPlaying(!state.playing));$('#restartBtn').addEventListener('click',()=>{setPlaying(false);renderScene(0)});
document.addEventListener('keydown',event=>{if(event.target.matches('button,[role="button"]'))return;if(event.key==='ArrowRight')move(1);if(event.key==='ArrowLeft')move(-1);if(event.key===' '){event.preventDefault();setPlaying(!state.playing)}});document.addEventListener('visibilitychange',()=>{if(document.hidden){setPlaying(false);cancelSceneAnimations();completeSceneAnimation(scenes[state.scene])}});
renderScene(0,false);
</script>
</body>
