function referenceEightSVG(){const rows=['0001111111000000','0011111111100000','0110000000110000','1100000000011000','1100000000011000','1100000000011000','1100000000011000','1100000000011000','0110000000110000','0011111111100000','0001111111000000','0011111111100000','0110000000110000','1100000000011000','1100000000011000','1100000000011000','1100000000011000','1100000000011000','0110000000110000','0011111111100000','0001111111000000'];const size=10,startX=110,startY=28;const pixels=rows.flatMap((row,y)=>[...row].map((value,x)=>value==='1'?`<rect class="reference-pixel" x="${startX+x*size}" y="${startY+y*size}" width="9.4" height="9.4" fill="${(x+y)%5===0?'#747c78':(x+y)%3===0?'#454c48':'#171b19'}"/>`:'' )).join('');return `<svg class="reference-eight" viewBox="0 0 380 285" role="img" aria-label="Dense black and gray pixel-grid reference 8 with labeled square corner, center bridge, outer edge, and stacked regions">
