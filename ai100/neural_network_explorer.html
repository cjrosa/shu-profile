<body>
<main class="shell">
  <div class="eyebrow">Neural Network Foundations</div>
  <h1>How does a neural network learn?</h1>
  <p class="intro">Start with human judgment, then follow how human choices frame a neural network’s inputs, design, training, and use. Watch applicant information move through weighted connections and consider where people remain responsible.</p>
  <nav class="chapter-bar" aria-label="Lesson chapters">
    <button class="chapter" data-chapter="0" data-number="1">Human Role</button><button class="chapter" data-chapter="1" data-number="2">Topology</button><button class="chapter" data-chapter="2" data-number="3">Train</button><button class="chapter" data-chapter="3" data-number="4">Reflect</button>
  </nav>
  <section class="story">
    <header class="story-head"><div><div class="scene-kicker" id="sceneKicker"></div><h2 class="scene-title" id="sceneTitle"></h2><p class="scene-copy" id="sceneCopy"></p></div><span class="scene-count" id="sceneCount"></span></header>
    <div class="canvas"><div id="sceneContent"></div></div>
  </section>
  <div class="controls"><div class="control-group"><button id="prevBtn">← Back</button><button id="restartBtn">Restart</button></div><div class="progress" role="progressbar" aria-label="Lesson progress" aria-valuemin="1"><div class="progress-fill" id="progressFill"></div></div><button class="primary" id="nextBtn">Next →</button></div>
  <div class="sr-only" id="liveStatus" aria-live="polite"></div>
</main>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const featureDefs=[['Age',18,75,' yrs'],['Income',20,180,'k'],['Credit',300,850,''],['Employed',0,35,' yrs'],['Loan amount',5,100,'k']];
const featureIcons=['🎂','$','★','💼','🏦'];
const initialValues=[34,78,710,7,35],initialWeights=[[.10,.50,0],[1.20,.80,.80],[1.50,.40,1.40],[.20,1.40,.30],[-1.30,-.30,-1.80]],initialHiddenBias=[-2,-.70,.20],initialOut=[2.40,1.80,2.40],initialOutBias=-2.30;
const scenes=[
 {chapter:0,kicker:'Human role · contextual judgment',title:'Begin with a human decision',copy:'Use the applicant information to make your own judgment before the network enters the process.',kind:'predict'},
 {chapter:1,kicker:'Topology · human choices',title:'People decide what becomes an input',copy:'Humans choose which parts of a real situation are represented as numbers—and which context the model will not see.',kind:'inputs'},
 {chapter:1,kicker:'Topology · designed to learn',title:'What happens between inputs and output?',copy:'A prediction needs more than a path from information to an answer. Reveal the hidden layer that gives the network a structure in which relationships can be learned.',kind:'topology'},
 {chapter:1,kicker:'Topology · activation functions',title:'An activation function shapes each unit’s output',copy:'After combining the five weighted inputs, each hidden unit uses a smooth activation function to produce an internal value between 0 and 1.',kind:'signals'},
 {chapter:1,kicker:'Topology · output layer',title:'The output layer turns activations into a prediction',copy:'One output unit combines the three hidden activations, applies its own activation function, and produces an approval probability.',kind:'forward'},
 {chapter:2,kicker:'Train · first example',title:'Training begins by checking one prediction',copy:'For the same applicant, compare the network’s prediction with the label supplied by the training dataset.',kind:'loss'},
 {chapter:2,kicker:'Train · adjust connections',title:'Error changes the connection weights',copy:'Backpropagation works backward to identify and slightly adjust contributing connections.',kind:'adjust'},
 {chapter:2,kicker:'Train · repeated examples',title:'Learning accumulates across many applicants',copy:'Several varied examples gradually change the same network and reduce its error.',kind:'many'},
 {chapter:3,kicker:'Reflect · after training',title:'Before using the model, examine what it learned',copy:'Training taught the network to reproduce relationships in its examples; people must now ask whether those relationships are fair and appropriate.',kind:'bias'},
 {chapter:3,kicker:'Reflect · explore',title:'Test the complete network',copy:'Change an input to automatically run a forward pass, then train on additional fictional examples.',kind:'sandbox'}
];
const state={scene:0,epoch:0,timers:new Set(),choice:null,values:[...initialValues],weights:initialWeights.map(r=>[...r]),out:[...initialOut],hiddenBias:[...initialHiddenBias],outBias:initialOutBias,trained:0};
const sigmoid=x=>1/(1+Math.exp(-x));
const norm=(v,i)=>(v-featureDefs[i][1])/(featureDefs[i][2]-featureDefs[i][1]);
function calculate(values=state.values){const x=values.map(norm),hidden=[0,1,2].map(j=>sigmoid(x.reduce((s,v,i)=>s+v*state.weights[i][j],state.hiddenBias[j]))),prob=sigmoid(hidden.reduce((s,v,j)=>s+v*state.out[j],state.outBias));return{x,hidden,prob}}
function labelFor(values,biased=false){const x=values.map(norm),affordability=1-Math.min(1,values[4]/Math.max(1,values[1]));let score=x[2]*.43+x[1]*.22+x[3]*.14+x[0]*.05+affordability*.16;if(biased&&x[0]<.28)score-=.22;return score>=.56?1:0}
function train(values,target,lr=.22){const r=calculate(values),dOut=r.prob-target,oldOut=[...state.out];state.out=state.out.map((w,j)=>w-lr*dOut*r.hidden[j]);state.outBias-=lr*dOut;state.weights=state.weights.map((row,i)=>row.map((w,j)=>w-lr*(dOut*oldOut[j]*r.hidden[j]*(1-r.hidden[j]))*r.x[i]));state.hiddenBias=state.hiddenBias.map((b,j)=>b-lr*dOut*oldOut[j]*r.hidden[j]*(1-r.hidden[j]));state.trained++;return{before:r.prob,after:calculate(values).prob}}
function randomApplicant(){return featureDefs.map((f,i)=>Math.round(f[1]+Math.random()*(f[2]-f[1])))}
function featureNameHTML(i){return `<span class="feature-symbol" aria-hidden="true">${featureIcons[i]}</span>${featureDefs[i][0]}`}
function formatFeatureValue(v,i){return `${i===1||i===4?'$':''}${v}${featureDefs[i][3]}`}
function applicantHTML(values=state.values){return `<div class="applicant-grid">${values.map((v,i)=>`<div class="datum"><b>${featureNameHTML(i)}</b><strong>${formatFeatureValue(v,i)}</strong></div>`).join('')}</div>`}
function networkSVG(mode='full',interactive=false){const ins=[54,122,190,258,326].map(y=>({x:75,y})),hid=[{x:315,y:95},{x:315,y:190},{x:315,y:285}],out={x:530,y:190},r=calculate(),direct=mode==='direct';let s=`<svg class="network" viewBox="0 0 600 380" role="img" aria-label="${direct?'Five inputs connected directly to one output':'Five inputs, three hidden units, and one output'}"><text class="layer-label" x="75" y="22">Inputs</text>${direct?'':`<text class="layer-label" x="315" y="22">Hidden Layer</text>`}<text class="layer-label" x="530" y="22">Output Layer</text>`;
 if(direct)ins.forEach(a=>s+=`<line class="direct-connection" x1="${a.x}" y1="${a.y}" x2="${out.x}" y2="${out.y}" stroke="var(--muted)" stroke-width="2" opacity=".42"/>`);if(!['inputs','topology','direct'].includes(mode))ins.forEach((a,i)=>hid.forEach((b,j)=>{const w=state.weights[i][j];s+=`<line class="connection" ${interactive?'tabindex="0" role="button"':''} data-source="${featureDefs[i][0]}" data-target="Unit ${j+1}" data-weight="${w}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${w>=0?'var(--green)':'var(--red)'}" stroke-width="${1+Math.abs(w)*5}" opacity=".62"/>`}));if(['full','forward','adjust','sandbox'].includes(mode))hid.forEach((a,j)=>{const w=state.out[j];s+=`<line class="connection" ${interactive?'tabindex="0" role="button"':''} data-source="Unit ${j+1}" data-target="Prediction" data-weight="${w}" x1="${a.x}" y1="${a.y}" x2="${out.x}" y2="${out.y}" stroke="${w>=0?'var(--green)':'var(--red)'}" stroke-width="${1+Math.abs(w)*5}" opacity=".68"/>`});ins.forEach((n,i)=>s+=nodeSVG(n,'input',featureDefs[i][0],featureIcons[i]));if(!['inputs','direct'].includes(mode))hid.forEach((n,j)=>s+=nodeSVG(n,'hidden',`Hidden unit ${j+1}`,`Unit ${j+1}`,mode==='topology'?null:r.hidden[j]));if(['direct','topology','connections','full','forward','adjust','sandbox'].includes(mode))s+=nodeSVG(out,'output','Output unit',['direct','topology','connections'].includes(mode)?'Output':`${Math.round(r.prob*100)}%`);return s+'</svg>'}
function nodeSVG(n,type,title,display,meter=null){const bar=meter===null?'':`<rect class="meter-bg" x="-20" y="12" width="40" height="5" rx="3"/><rect class="meter-fill" x="-20" y="12" width="${Math.max(2,meter*40)}" height="5" rx="3"/>`;return `<g transform="translate(${n.x} ${n.y})"><g class="node ${type}" tabindex="0" role="button" aria-label="Explain ${title}" data-title="${title}"><circle r="${type==='output'?40:type==='input'?27:32}"/><text y="${meter===null?4:0}">${display}</text>${bar}</g></g>`}
function networkBlock(mode='full',interactive=false,note=''){return `<div class="network-wrap">${networkSVG(mode,interactive)}<div class="legend"><span><i></i>Raises signal</span><span><i class="red"></i>Lowers signal</span><span>Thicker = stronger</span></div><div class="explain" id="networkExplain">${note||'<strong>Explore the network.</strong> Select a node or connection to see what it contributes.'}</div></div>`}
function outputLessonHTML(r){
 const probability=Math.round(r.prob*100),decision=r.prob>=.5?'approve':'decline',human=state.choice===null?'No human judgment was recorded.':`Your Scene 1 judgment was ${state.choice?'approve':'decline'}.`;
 return `<div class="output-lesson">
  <div class="output-workbench">
   <div><div class="output-heading">Hidden layer</div><div class="output-hidden">${r.hidden.map((output,j)=>`<div class="prediction-unit" aria-label="Unit ${j+1} activation output ${output.toFixed(2)}"><span>Unit ${j+1}</span><strong>${output.toFixed(2)}</strong></div>`).join('')}</div></div>
   <svg class="output-connector" id="outputConnector" viewBox="0 0 160 260" preserveAspectRatio="none" role="img" aria-label="Three weighted connections converge on the output unit" hidden>${r.hidden.map((_,j)=>`<line class="output-link" aria-label="Unit ${j+1} to output, weight ${state.out[j].toFixed(2)}" x1="0" y1="${[43,130,217][j]}" x2="160" y2="130" stroke="#1f7a46" opacity=".72" stroke-linecap="round" stroke-width="${1+Math.abs(state.out[j])*5}" vector-effect="non-scaling-stroke" style="stroke:#1f7a46;opacity:.72"/>`).join('')}</svg>
   <div class="output-node-wrap" id="outputNodeStage" hidden><div class="output-heading">Output layer</div><div class="output-node" id="outputNode" role="img" aria-label="Output unit waiting to apply its activation function"><span>Output Unit</span></div></div>
   <div class="output-process" id="outputProcess" hidden><div class="panel-title">What the output unit does</div><div class="process-step">1. Combine outputs</div><div class="process-step">2. Add bias</div><div class="process-step">3. Apply activation</div><div class="probability-result"><span>Approval probability</span><strong>${probability}%</strong><span>Output activation: ${r.prob.toFixed(2)}</span></div></div>
  </div>
  <div class="explain" id="outputExplain"><strong>Begin with the hidden activations.</strong> These three internal values now become inputs to a separate output layer.</div>
  <div class="choice-row" id="outputAction"><button class="primary" id="connectOutputBtn">Connect to the output unit</button></div>
  <div class="threshold-wrap" id="thresholdStage" hidden><div class="panel-title">Turn the probability into a prediction</div><div class="threshold-labels"><span>Below 0.50 · Decline</span><span>0.50 or above · Approve</span></div><div class="threshold-track" role="img" aria-label="Decision threshold at 0.50, model output ${r.prob.toFixed(2)}"><span class="threshold-mid"></span><span class="threshold-marker" data-value="${r.prob.toFixed(2)}" style="left:${Math.max(2,Math.min(98,r.prob*100))}%"></span></div><div class="decision-result">Prediction: <strong>${decision}</strong> · ${human}</div></div>
  <div class="note" id="outputCaution" hidden><strong>This is a fictional starting estimate.</strong> Training will refine the weights using labeled examples; real lending decisions require validated data and human oversight.</div>
 </div>`
}
function sandboxThresholdHTML(prob){const decision=prob>=.5?'approve':'decline';return `<div class="threshold-wrap sandbox-threshold"><div class="panel-title">Turn the probability into a prediction</div><div class="threshold-labels"><span>Below 0.50 · Decline</span><span>0.50 or above · Approve</span></div><div class="threshold-track" id="sandboxThresholdTrack" role="img" aria-label="Decision threshold at 0.50, model output ${prob.toFixed(2)}"><span class="threshold-mid"></span><span class="threshold-marker" id="sandboxThresholdMarker" data-value="${prob.toFixed(2)}" style="left:${Math.max(2,Math.min(98,prob*100))}%"></span></div><div class="decision-result">Prediction: <strong id="sandboxDecision">${decision}</strong> · Classification uses the 0.50 threshold.</div></div>`}
function renderContent(scene){const p=Math.round(calculate().prob*100),target=labelFor(state.values);if(scene.kind==='predict')return `<div class="applicant"><div class="panel-title">Applicant information for human review</div>${applicantHTML()}<div class="choice-row"><button data-choice="0">I would decline</button><button data-choice="1">I would approve</button></div><div class="explain" id="choiceStatus"><strong>You are the human in the loop.</strong> Make a judgment using the available context; later, compare your reasoning with the network’s numerical estimate.</div></div>`;
 if(scene.kind==='inputs')return `<div class="input-scene">${state.values.map((v,i)=>`<div class="input-card"><span class="input-icon" aria-hidden="true">${featureIcons[i]}</span><b>${featureDefs[i][0]}</b><div>${formatFeatureValue(v,i)}</div></div>`).join('')}</div><div class="note"><strong>Human-in-the-loop checkpoint:</strong> people selected these five inputs. That choice determines what evidence the network can use—and what context it cannot consider.</div>`;
 if(scene.kind==='topology')return `<div class="network-wrap">${networkSVG('direct')}<div class="legend" id="topologyLegend" hidden><span><i></i>Raises signal</span><span><i class="red"></i>Lowers signal</span><span>Thicker = stronger</span></div><div class="explain" id="networkExplain"><strong>Where are the decision makers now?</strong> The inputs reach an output, but no person has written rules for how the evidence should be combined.</div><div class="choice-row" id="topologyAction"><button class="primary" id="revealHiddenBtn">Reveal what is missing</button></div></div>`;
 if(scene.kind==='signals'){const r=calculate();return `<div class="unit-focus">${r.hidden.map((output,j)=>`<article class="unit-card"><div class="unit-inputs" aria-label="All five inputs">${featureIcons.join(' ')}</div><div class="unit-circle">Unit ${j+1}</div><div class="activation-step">Weighted total → activation function</div><div class="bar-label"><span>Activation output</span><span>${output.toFixed(2)}</span></div><div class="signal-track"><div class="signal-fill" style="width:${output*100}%"></div></div></article>`).join('')}</div><div class="note"><strong>Earlier perceptrons may have used a hard threshold: 0 or 1.</strong> Here, a smooth activation function preserves degrees of response between 0 and 1. These internal outputs are not confidence scores or separate predictions.</div>`}
 if(scene.kind==='forward')return outputLessonHTML(calculate());
 if(scene.kind==='loss')return `<div class="loss-context"><div class="loss-context-copy"><strong>Current training example</strong>The same fictional applicant from the earlier prediction.</div><div class="training-data">${compactApplicantHTML(state.values,target)}</div></div><div class="compare"><div class="compare-card"><div class="panel-title">1 · Prediction made before feedback</div><strong>${p}% approval</strong><div class="bar-label"><span>Network probability</span><span>${p}%</span></div><div class="bar-track"><div class="bar-fill" style="width:${p}%"></div></div></div><div class="compare-card"><div class="panel-title">2 · Dataset label revealed</div><strong>${target?'Approved':'Declined'}</strong><div class="bar-label"><span>Difference from label</span><span>${Math.round(Math.abs(target-p/100)*100)} points</span></div><div class="bar-track"><div class="bar-fill error" style="width:${Math.abs(target-p/100)*100}%"></div></div></div></div><div class="note"><strong>Now training can begin.</strong> The network made its prediction before seeing the label. Their difference becomes feedback for adjusting the weights—but a dataset label is not automatically fair or correct.</div>`;
 if(scene.kind==='adjust')return `<div id="adjustScene">${networkBlock('adjust',false,'<strong>Follow the error backward.</strong> The network traces which connections contributed, then nudges their weights before predicting again.')}<div class="choice-row"><button class="primary" id="adjustBtn">Adjust connections</button></div></div>`;
 if(scene.kind==='many')return `<div class="training-scene"><div class="training-phases" aria-label="Training cycle"><div class="training-phase" id="manyForward"><b>1 · Forward pass</b>Make a prediction</div><div class="training-phase error" id="manyLoss"><b>2 · Check error</b>Compare with label</div><div class="training-phase" id="manyBack"><b>3 · Adjust weights</b>Send feedback backward</div></div><div class="training-data" id="manyExample" aria-live="polite"></div><div class="training-network" id="trainingNetwork">${networkSVG('full')}</div><div class="training-status" id="manyStatus">Ready to train the network across several fictional applicants.</div><div class="choice-row" id="manyStartAction"><button class="primary" id="startTrainingBtn">Start training</button></div><div class="training-summary"><span><b id="manyCount">0</b> examples</span><span><b id="manyCorrect">—</b> accuracy</span><span><b id="manyError">—</b> current error</span></div></div>`;
 if(scene.kind==='bias')return `<div class="reflection-context"><div class="panel-title">Why reflect now?</div><div class="reflection-flow"><div class="reflection-step"><strong>1 · Training reduced error</strong>The weights changed to better match dataset labels.</div><span class="reflection-arrow" aria-hidden="true">→</span><div class="reflection-step"><strong>2 · The model learned relationships</strong>It cannot tell a useful relationship from an unfair one.</div><span class="reflection-arrow" aria-hidden="true">→</span><div class="reflection-step"><strong>3 · People evaluate impact</strong>Human review is required before the model is used.</div></div><p class="reflection-setup">Below, the same network design is trained on two different fictional datasets.</p></div><div class="compare"><div class="compare-card"><div class="panel-title">Dataset A · balanced labels</div><h3>Varied age groups represented</h3><div class="bar-label"><span>Training error</span><span>Lower</span></div><div class="bar-track"><div class="bar-fill" style="width:28%"></div></div><p>Predictions mainly follow the stated qualification signals.</p></div><div class="compare-card" style="border-color:var(--red)"><div class="panel-title">Dataset B · biased labels</div><h3>Younger applicants penalized</h3><div class="bar-label"><span>Training error</span><span>Also lower</span></div><div class="bar-track"><div class="bar-fill error" style="width:24%"></div></div><p>The network can learn that unfair relationship while still matching its labels.</p></div></div><div class="note"><strong>Same architecture, different training data, different behavior.</strong> Accuracy, fairness, and appropriate use remain separate questions.</div>`;
 return `<div class="sandbox"><div class="sandbox-grid"><div class="sandbox-panel"><div id="sandboxInputs"></div><div class="sandbox-actions"><button class="primary" id="trainNextBtn">Train next</button><button id="trainBatchBtn">Train 25</button><button id="resetModelBtn">Reset</button></div><details><summary>Training options</summary><div class="field"><label for="datasetType">Dataset</label><select id="datasetType"><option value="balanced">Balanced</option><option value="biased">Biased</option></select></div><div class="field"><label for="cycleMode">Learning cycle</label><select id="cycleMode"><option value="auto">Automatic</option><option value="step">Show forward, error, and adjustment</option></select></div><div class="field"><label for="trainingSpeedOption">Animation speed</label><select id="trainingSpeedOption"><option value="900">Slow</option><option value="550" selected>Normal</option><option value="250">Fast</option></select></div></details><div class="sandbox-result"><span id="sandboxStats">${state.trained} examples trained</span><b id="sandboxPrediction">${p}% approval probability</b></div></div><div class="sandbox-panel" id="sandboxNetwork">${networkBlock('sandbox',true,'<strong>Try a counterfactual.</strong> Change one input and watch a new forward pass travel through the network automatically.')}</div></div>${sandboxThresholdHTML(calculate().prob)}<div class="disclaimer">Fictional teaching example. Real lending systems require legal review, validation, broader evidence, and human accountability.</div></div>`}
function animateTopology(){
 const box=$('#networkExplain'),inputY=[54,122,190,258,326],hiddenY=[95,190,285],lines=[];
 $('.network').outerHTML=networkSVG('topology');
 box.innerHTML='<strong>The hidden layer supplies the missing decision-making structure.</strong> Its units are designed to learn subsymbolic rules during training: distributed numerical relationships rather than readable if–then instructions.';
 bindNetwork();
 box.insertAdjacentHTML('afterend','<div class="choice-row" id="topologyStep"><button class="primary" id="connectHiddenBtn">Connect the network</button></div>');
 $('#connectHiddenBtn').onclick=()=>{
  const svg=$('.network'),addLine=(x1,y1,x2,y2,source,target,weight)=>{const line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('class','connection unweighted');line.setAttribute('x1',x1);line.setAttribute('y1',y1);line.setAttribute('x2',x2);line.setAttribute('y2',y2);line.setAttribute('stroke','var(--muted)');line.setAttribute('stroke-width','2');line.setAttribute('opacity','.55');line.dataset.source=source;line.dataset.target=target;line.dataset.weight=weight;line.style.setProperty('--draw-delay',`${lines.length*.055}s`);svg.insertBefore(line,svg.querySelector('.node')?.parentElement||null);lines.push(line)};
  $('#topologyStep').remove();
  inputY.forEach((y,i)=>hiddenY.forEach((hy,j)=>addLine(75,y,315,hy,featureDefs[i][0],`Unit ${j+1}`,state.weights[i][j])));
  hiddenY.forEach((hy,j)=>addLine(315,hy,530,190,`Unit ${j+1}`,'Prediction',state.out[j]));
  box.innerHTML='<strong>The complete network is connected.</strong> Every input reaches every hidden unit, and every hidden unit reaches the output. Training can adjust all 18 connections.';
  box.insertAdjacentHTML('afterend','<div class="choice-row" id="topologyStep"><button class="primary" id="showWeightsBtn">Show initial weights</button></div>');
  $('#showWeightsBtn').onclick=()=>{
   $('#topologyStep').remove();$('#topologyLegend').hidden=false;
   box.innerHTML='<strong>These are illustrative starting weights—not learned rules.</strong> Thickness shows the size of each weight. Training will repeatedly adjust these values and encode subsymbolic relationships across the network.';
   lines.forEach((line,index)=>schedule(()=>{const w=+line.dataset.weight;line.classList.remove('unweighted');line.setAttribute('stroke',w>=0?'var(--green)':'var(--red)');line.setAttribute('stroke-width',1+Math.abs(w)*5);line.setAttribute('opacity','.65');line.setAttribute('tabindex','0');line.setAttribute('role','button');if(index===lines.length-1)bindNetwork()},index*35));
  };
 };
}
function animateOutputParticles(done){const svg=$('#outputConnector'),lines=$$('#outputConnector .output-link'),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,duration=reduced?1:520,stagger=reduced?0:110;lines.forEach((line,index)=>schedule(()=>{const token=document.createElementNS('http://www.w3.org/2000/svg','circle'),x1=+line.getAttribute('x1'),y1=+line.getAttribute('y1'),x2=+line.getAttribute('x2'),y2=+line.getAttribute('y2');token.setAttribute('r','5');token.setAttribute('class','output-token');svg.appendChild(token);token.animate([{transform:`translate(${x1}px,${y1}px)`},{transform:`translate(${x2}px,${y2}px)`}],{duration,fill:'forwards'}).onfinish=()=>token.remove()},index*stagger));schedule(done,duration+(lines.length-1)*stagger+40)}
function bindOutputLesson(){
 const r=calculate(),box=$('#outputExplain'),action=$('#outputAction');
 const announce=message=>{$('#liveStatus').textContent=message};
 const setAction=(label,id,handler)=>{action.innerHTML=`<button class="primary" id="${id}">${label}</button>`;$(`#${id}`).onclick=handler};
 setAction('Connect to the output unit','connectOutputBtn',()=>{
  const connector=$('#outputConnector');connector.hidden=false;connector.removeAttribute('hidden');connector.style.display='block';$$('#outputConnector .output-link').forEach(line=>{line.style.stroke='#1f7a46';line.style.opacity='.72';line.style.strokeDasharray='none';line.style.strokeDashoffset='0'});$('#outputNodeStage').hidden=false;action.innerHTML='';
  box.innerHTML='<strong>The output layer has its own weighted connections.</strong> Each hidden activation can influence the output by a different amount.';
  announce('The three hidden units are now connected to one output unit with weighted connections.');
  animateOutputParticles(()=>{
   setAction('Apply the output activation','activateOutputBtn',()=>{
    $('#outputProcess').hidden=false;$('#outputCaution').hidden=false;
    const node=$('#outputNode');node.innerHTML=`<span>Output Unit</span><strong>${r.prob.toFixed(2)}</strong>`;node.setAttribute('aria-label',`Output unit activation ${r.prob.toFixed(2)}`);
    box.innerHTML='<strong>The output unit performs another neuron calculation.</strong> It combines the three activations using weights, adds a baseline adjustment called bias, and applies a smooth activation function.';
    announce(`The output activation is ${r.prob.toFixed(2)}, shown as ${Math.round(r.prob*100)} percent approval probability.`);
    setAction('Apply the 0.50 decision threshold','thresholdOutputBtn',()=>{
     $('#thresholdStage').hidden=false;action.innerHTML='';
     const decision=r.prob>=.5?'approve':'decline';
     box.innerHTML=`<strong>Probability and prediction are different.</strong> The output layer produced ${Math.round(r.prob*100)}% approval probability. The 0.50 decision rule turns it into the classification “${decision}.”`;
     announce(`The ${r.prob.toFixed(2)} output is ${r.prob>=.5?'at or above':'below'} the 0.50 threshold, so the network predicts ${decision}.`);
    });
   });
  });
 });
}
function bindScene(scene){bindNetwork();if(scene.kind==='topology')$('#revealHiddenBtn').onclick=()=>{$('#revealHiddenBtn').disabled=true;$('#topologyAction').remove();animateTopology()};if(scene.kind==='forward')bindOutputLesson();if(scene.kind==='predict')$$('[data-choice]').forEach(b=>b.onclick=()=>{state.choice=+b.dataset.choice;$$('[data-choice]').forEach(x=>x.classList.toggle('chosen',x===b));$('#choiceStatus').innerHTML=`<strong>Human judgment recorded:</strong> ${state.choice?'Approve':'Decline'}. Keep it in mind—the network may reach a different answer without understanding the person or consequences.`;});if(scene.kind==='adjust')$('#adjustBtn').onclick=()=>{const button=$('#adjustBtn'),target=labelFor(state.values),before=calculate().prob;button.disabled=true;$('#networkExplain').innerHTML='<strong>Backpropagation.</strong> Red error particles move from the output toward every connection that contributed.';animateNetworkParticles('#adjustScene',true,()=>{train(state.values,target);$('#adjustScene .network-wrap').outerHTML=networkBlock('adjust',false,`<strong>One learning step complete.</strong> The estimate moved from ${Math.round(before*100)}% to ${Math.round(calculate().prob*100)}% after the weights shifted toward the label.`);bindNetwork()},420)};if(scene.kind==='many')$('#startTrainingBtn').onclick=()=>{$('#manyStartAction').remove();$('#manyStatus').textContent='Loading the first training example…';$('#liveStatus').textContent='Training started. The first example will move through the network.';runManyExamples()};if(scene.kind==='sandbox')bindSandbox()}
function bindNetwork(){const box=$('#networkExplain');if(!box)return;$$('.connection').forEach(line=>{const explain=()=>{box.textContent=`${line.dataset.source} → ${line.dataset.target}: weight ${(+line.dataset.weight).toFixed(2)}. This connection ${+line.dataset.weight>=0?'raises':'lowers'} the next signal.`};line.onclick=explain;line.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();explain()}}});$$('.node').forEach(n=>n.onclick=()=>{box.textContent=n.classList.contains('hidden')?'This hidden unit combines all five inputs, applies an activation function, and sends a signal between 0 and 1.':n.classList.contains('output')?'The output combines the three hidden-unit signals into the prediction.':'This input carries one applicant value into the network.'})}
function schedule(fn,ms){const epoch=state.epoch,id=setTimeout(()=>{state.timers.delete(id);if(epoch===state.epoch)fn()},ms);state.timers.add(id)}function clearAnimations(){state.timers.forEach(clearTimeout);state.timers.clear();state.sliderTimer=null;state.sandboxPass=(state.sandboxPass||0)+1}
function compactApplicantHTML(values,target){return values.map((v,i)=>`<span class="training-datum"><b>${featureNameHTML(i)}</b>${formatFeatureValue(v,i)}</span>`).join('')+`<span class="training-label ${target?'':'declined'}">Label: ${target?'Approved':'Declined'}</span>`}
function setManyPhase(active){[$('#manyForward'),$('#manyLoss'),$('#manyBack')].forEach((phase,i)=>phase.classList.toggle('active',i===active))}
function refreshTrainingNetwork(){const host=$('#trainingNetwork');if(host)host.innerHTML=networkSVG('full')}
function runManyExamples(){let count=0,correct=0;const step=()=>{if(count>=8){for(let i=0;i<17;i++){const v=randomApplicant();train(v,labelFor(v))}refreshTrainingNetwork();setManyPhase(-1);$('#manyCount').textContent='25';$('#manyStatus').textContent='Fast batch complete · the same network accumulated weight updates from 25 examples.';return}const v=randomApplicant(),target=labelFor(v),before=calculate(v).prob,error=Math.abs(target-before);count++;correct+=(before>=.5)===!!target;$('#manyExample').innerHTML=compactApplicantHTML(v,target);$('#manyCount').textContent=count;$('#manyCorrect').textContent=Math.round(correct/count*100)+'%';$('#manyError').textContent=Math.round(error*100)+'%';refreshTrainingNetwork();setManyPhase(0);$('#manyStatus').textContent=`Example ${count} · forward particles carry the inputs toward a ${Math.round(before*100)}% approval estimate.`;animateNetworkParticles('#trainingNetwork',false,()=>{setManyPhase(1);$('#trainingNetwork .node.output').classList.add('loss-pulse');$('#manyStatus').textContent=`Check error · prediction ${Math.round(before*100)}% compared with label ${target?'Approved':'Declined'}.`;schedule(()=>{setManyPhase(2);$('#manyStatus').textContent='Red feedback particles move backward before the weights adjust.';animateNetworkParticles('#trainingNetwork',true,()=>{train(v,target);refreshTrainingNetwork();step()},190)},180)},190)};step()}
function setSandboxBusy(busy){$$('#trainNextBtn,#trainBatchBtn,#resetModelBtn,#sandboxInputs input,#sandboxInputs select').forEach(control=>control.disabled=busy)}
function animateNetworkParticles(root,backward,done,speedOverride=null){const svg=$(`${root} .network`),lines=$$(`${root} .connection`),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,chosenSpeed=speedOverride??+($('#trainingSpeedOption')?.value||550),duration=reduced?1:Math.max(150,chosenSpeed),stagger=reduced?0:Math.max(7,chosenSpeed/22),ordered=backward?[...lines].reverse():lines;ordered.forEach((line,index)=>schedule(()=>{const token=document.createElementNS('http://www.w3.org/2000/svg','circle'),x1=+line.getAttribute('x1'),y1=+line.getAttribute('y1'),x2=+line.getAttribute('x2'),y2=+line.getAttribute('y2');token.setAttribute('r','5');token.setAttribute('class',`flow-token${backward?' backward':''}`);svg.appendChild(token);token.animate([{transform:`translate(${backward?x2:x1}px,${backward?y2:y1}px)`},{transform:`translate(${backward?x1:x2}px,${backward?y1:y2}px)`}],{duration,fill:'forwards'}).onfinish=()=>token.remove()},index*stagger));schedule(done,duration+(lines.length-1)*stagger+40)}
function animateSandboxParticles(backward,done){animateNetworkParticles('#sandboxNetwork',backward,done)}
function loadSandboxApplicant(values){state.values=[...values];$$('[data-input]').forEach(input=>{const i=+input.dataset.input;input.value=state.values[i];$(`#sv${i}`).textContent=formatFeatureValue(state.values[i],i)})}
function queueSandboxForward(){const pass=state.sandboxPass=(state.sandboxPass||0)+1;if(state.sliderTimer){clearTimeout(state.sliderTimer);state.timers.delete(state.sliderTimer)}const epoch=state.epoch,id=setTimeout(()=>{state.timers.delete(id);state.sliderTimer=null;if(epoch!==state.epoch||pass!==state.sandboxPass||state.scene!==9)return;const box=$('#networkExplain');box.innerHTML='<strong>Input changed.</strong> A new forward pass carries the updated values through the network.';animateSandboxParticles(false,()=>{if(pass!==state.sandboxPass||state.scene!==9)return;$('#sandboxNetwork .node.output').classList.add('loss-pulse');box.innerHTML=`<strong>Prediction updated.</strong> The output now estimates ${Math.round(calculate().prob*100)}% approval for these inputs.`;$('#liveStatus').textContent=`Forward pass complete. Updated approval estimate: ${Math.round(calculate().prob*100)} percent.`})},140);state.sliderTimer=id;state.timers.add(id)}
function runSandboxTraining(batchSize=1){const biased=$('#datasetType').value==='biased',values=randomApplicant(),target=labelFor(values,biased),before=calculate(values).prob;loadSandboxApplicant(values);updateSandbox();setSandboxBusy(true);$('#networkExplain').innerHTML='<strong>1 · Forward pass.</strong> The new labeled applicant moves through the current weights.';animateSandboxParticles(false,()=>{$('#sandboxNetwork .node.output').classList.add('loss-pulse');$('#networkExplain').innerHTML=`<strong>2 · Check error.</strong> Prediction ${Math.round(before*100)}% is compared with the ${target?'Approved':'Declined'} label.`;const delay=Math.max(180,+$('#trainingSpeedOption').value/2);schedule(()=>{$('#networkExplain').innerHTML='<strong>3 · Backpropagation.</strong> Red feedback particles carry the error backward through every contributing connection.';animateSandboxParticles(true,()=>{train(values,target);for(let i=1;i<batchSize;i++){const v=randomApplicant();train(v,labelFor(v,biased))}updateSandbox();$('#networkExplain').innerHTML=`<strong>${batchSize===1?'Training example':'Training batch'} complete.</strong> The updated line thicknesses show the network’s new weights.`;setSandboxBusy(false)})},delay)})}
function bindSandbox(){const host=$('#sandboxInputs');host.innerHTML=featureDefs.map((f,i)=>`<div class="field"><label><span>${featureNameHTML(i)}</span><output id="sv${i}">${formatFeatureValue(state.values[i],i)}</output></label><input data-input="${i}" type="range" min="${f[1]}" max="${f[2]}" value="${state.values[i]}"></div>`).join('');$$('[data-input]').forEach(input=>input.oninput=()=>{const i=+input.dataset.input;state.values[i]=+input.value;$(`#sv${i}`).textContent=formatFeatureValue(state.values[i],i);updateSandbox();queueSandboxForward()});$('#trainNextBtn').onclick=()=>runSandboxTraining(1);$('#trainBatchBtn').onclick=()=>runSandboxTraining(25);$('#resetModelBtn').onclick=()=>{resetModel();renderScene(9,false)}}
function updateSandbox(){const prob=calculate().prob,p=Math.round(prob*100),decision=prob>=.5?'approve':'decline',marker=$('#sandboxThresholdMarker'),track=$('#sandboxThresholdTrack');$('#sandboxPrediction').textContent=p+'% approval probability';$('#sandboxStats').textContent=state.trained+' examples trained';if(marker){marker.style.left=Math.max(2,Math.min(98,prob*100))+'%';marker.dataset.value=prob.toFixed(2)}if(track)track.setAttribute('aria-label',`Decision threshold at 0.50, model output ${prob.toFixed(2)}`);if($('#sandboxDecision'))$('#sandboxDecision').textContent=decision;$('#sandboxNetwork').innerHTML=networkBlock('sandbox',true,'<strong>Prediction refreshed.</strong> These signal bars and the output now reflect the current applicant and latest learned weights.');bindNetwork()}
function resetModel(){state.values=[...initialValues];state.weights=initialWeights.map(r=>[...r]);state.out=[...initialOut];state.hiddenBias=[...initialHiddenBias];state.outBias=initialOutBias;state.trained=0}
function renderScene(index,announce=true){clearAnimations();state.epoch++;state.scene=Math.max(0,Math.min(scenes.length-1,index));const scene=scenes[state.scene];$('#sceneKicker').textContent=scene.kicker;$('#sceneTitle').textContent=scene.title;$('#sceneCopy').textContent=scene.copy;$('#sceneCount').textContent=`Scene ${state.scene+1} of ${scenes.length}`;const content=$('#sceneContent');content.classList.remove('scene-content');void content.offsetWidth;content.innerHTML=renderContent(scene);content.classList.add('scene-content');$$('.chapter').forEach(x=>x.classList.toggle('active',+x.dataset.chapter===scene.chapter));$('#prevBtn').disabled=state.scene===0;$('#nextBtn').disabled=state.scene===scenes.length-1;$('#nextBtn').textContent=state.scene===scenes.length-1?'Lesson complete':'Next →';$('#progressFill').style.width=`${(state.scene+1)/scenes.length*100}%`;$('.progress').setAttribute('aria-valuemax',scenes.length);$('.progress').setAttribute('aria-valuenow',state.scene+1);bindScene(scene);if(announce)$('#liveStatus').textContent=`Scene ${state.scene+1}: ${scene.title}. ${scene.copy}`}
$('#prevBtn').onclick=()=>renderScene(state.scene-1);$('#nextBtn').onclick=()=>{if(state.scene<scenes.length-1)renderScene(state.scene+1)};$('#restartBtn').onclick=()=>{resetModel();state.choice=null;renderScene(0)};$$('.chapter').forEach(b=>b.onclick=()=>renderScene(scenes.findIndex(s=>s.chapter===+b.dataset.chapter)));document.addEventListener('keydown',e=>{if(e.target.matches('button,input,select,[role=button]'))return;if(e.key==='ArrowRight'&&state.scene<scenes.length-1)renderScene(state.scene+1);if(e.key==='ArrowLeft'&&state.scene>0)renderScene(state.scene-1)});document.addEventListener('visibilitychange',()=>{if(document.hidden)clearAnimations()});renderScene(0,false);
</script>
</body>
