{from{opacity:0;transform:translateY(5px)}}.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}.control-group{display:flex;gap:8px}.progress{flex:1;max-width:390px;height:5px;border-radius:99px;background:#dfe6e1;overflow:hidden}.progress-fill{height:100%;background:var(--green);transition:width .3s}button{min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer;font-weight:750}button:hover:not(:disabled){border-color:var(--green);color:var(--green)}button.primary{border-color:var(--green);background:var(--green);color:#fff}button.primary:hover:not(:disabled){border-color:var(--green-dark);background:var(--green-dark);color:#fff}button:focus-visible,input:focus-visible,select:focus-visible,[role=button]:focus-visible{outline:3px solid rgba(39,116,200,.35);outline-offset:2px}button:disabled{cursor:not-allowed;opacity:.42}.note{max-width:780px;margin:17px auto 0;padding:10px 13px;border-radius:9px;background:var(--amber-soft);color:#75450c;text-align:center;font-size:11px;line-height:1.45}.note.neutral{background:#f2f6f3;color:var(--muted)}.note strong{color:var(--ink)}.panel-title{margin-bottom:8px;font-size:11px;font-weight:850}.applicant{max-width:690px;margin:auto;padding:20px;border:1px solid var(--line);border-radius:14px;background:#f7f9f8}.applicant-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.datum{padding:13px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:center}.datum b{display:block;color:var(--muted);font-size:9px;text-transform:uppercase}.datum strong{font-size:19px}.choice-row{display:flex;justify-content:center;gap:9px;margin-top:18px}.choice-row button.chosen{box-shadow:0 0 0 3px var(--blue-soft);border-color:var(--blue);color:var(--blue)}.network-wrap{max-width:900px;margin:auto}.network{display:block;width:100%;height:360px}.layer-label{fill:var(--muted);font-size:12px;font-weight:850;text-anchor:middle;text-transform:uppercase}.connection{cursor:pointer;transition:stroke-width .4s,opacity .3s}.connection:focus{outline:none;filter:drop-shadow(0 0 4px var(--blue))}.connection.warm{animation:warm .7s}.connection.cool{animation:cool .7s}@keyframes warm{50%{stroke:var(--amber);filter:drop-shadow(0 0 7px var(--amber))}}@keyframes cool{50%{stroke:var(--blue);filter:drop-shadow(0 0 7px var(--blue))}}.node{cursor:pointer}.node circle{fill:#fff;stroke:var(--green);stroke-width:2}.node.hidden circle{fill:var(--green-soft)}.node.output circle{fill:var(--green);stroke:var(--green-dark)}.node text{fill:var(--ink);font-size:10px;font-weight:850;text-anchor:middle;pointer-events:none}.node.output text{fill:#fff}.meter-bg{fill:#dcefe4}.meter-fill{fill:var(--green)}.legend{display:flex;justify-content:center;gap:15px;color:var(--muted);font-size:10px}.legend i{display:inline-block;width:20px;height:3px;margin-right:5px;background:var(--green);vertical-align:middle}.legend i.red{background:var(--red)}.explain{min-height:40px;max-width:760px;margin:12px auto 0;padding:10px;border-radius:9px;background:var(--blue-soft);color:#174f69;font-size:11px;text-align:center}.input-scene{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:760px;margin:auto}.input-card{padding:20px 10px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:center;animation:pop .35s both}.input-card:nth-child(2){animation-delay:.15s}.input-card:nth-child(3){animation-delay:.3s}.input-card:nth-child(4){animation-delay:.45s}@keyframes pop{from{opacity:0;transform:scale(.92)}}.input-icon{display:grid;place-items:center;width:48px;height:48px;margin:auto auto 8px;border-radius:50%;background:var(--green-soft);color:var(--green);font-weight:900}.compare{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:850px;margin:auto}.compare-card{padding:18px;border:1px solid var(--line);border-radius:14px;background:#f7f9f8}.bar-label{display:flex;justify-content:space-between;margin:10px 0 5px;font-size:11px;font-weight:800}.bar-track{height:14px;border-radius:99px;background:#e6ebe8;overflow:hidden}.bar-fill{height:100%;background:var(--green);transition:width .65s}.bar-fill.error{background:var(--red)}.error-token{color:var(--red);font-size:13px;font-weight:900;text-align:center;animation:back 1.2s infinite}@keyframes back{50%{transform:translateX(-8px);opacity:.55}}.training-layout{display:grid;grid-template-columns:minmax(210px,.7fr) minmax(330px,1.3fr);gap:22px;max-width:920px;margin:auto}.example-card{padding:16px;border:1px solid var(--line);border-radius:13px;background:#fff}.example-card strong{font-size:22px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.stat{padding:10px;border-radius:9px;background:var(--green-soft);text-align:center}.stat b{display:block;font-size:18px}.stat span{font-size:9px;color:var(--muted)}.trend{display:flex;align-items:end;gap:6px;height:150px;padding:12px;border-bottom:2px solid var(--line)}.trend i{flex:1;min-width:8px;background:var(--red);border-radius:4px 4px 0 0;transition:height .35s}.recap{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;max-width:950px;margin:auto}.recap-card{padding:14px 9px;border:1px solid var(--line);border-radius:11px;background:#f7f9f8;text-align:center;font-size:10px}.recap-card b{display:grid;place-items:center;width:24px;height:24px;margin:0 auto 7px;border-radius:50%;background:var(--green);color:#fff}.sandbox{max-width:1050px;margin:auto}.sandbox-grid{display:grid;grid-template-columns:260px 1fr;gap:18px}.sandbox-panel{min-width:0;padding:15px;border:1px solid var(--line);border-radius:13px;background:#f7f9f8}.field{min-width:0;margin-bottom:12px}.field label{display:flex;justify-content:space-between;margin-bottom:5px;font-size:10px;font-weight:800}.field input{width:100%;accent-color:var(--green)}.field select{display:block;width:100%;min-width:0;min-height:38px;padding:0 34px 0 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-size:11px;font-weight:700}.sandbox-actions{display:flex;flex-wrap:wrap;gap:7px}.sandbox-result{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:11px;color:var(--muted)}details{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}summary{margin-bottom:12px;color:var(--green-dark);cursor:pointer;font-size:11px;font-weight:800}summary:hover{color:var(--green)}.disclaimer{margin-top:14px;color:var(--muted);font-size:10px;text-align:center}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.training-scene{max-width:920px;margin:auto}.training-phases{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.training-phase{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#f7f9f8;color:var(--muted);font-size:9px}.training-phase b{display:block;color:var(--ink);font-size:10px}.training-phase.active{border-color:var(--green);background:var(--green-soft);color:var(--green-dark)}.training-phase.error.active{border-color:var(--red);background:var(--red-soft);color:var(--red)}.training-data{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;margin-bottom:4px}.training-datum{padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);font-size:9px}.training-datum b{margin-right:3px;color:var(--muted);font-size:8px;text-transform:uppercase}.training-label{padding:5px 9px;border-radius:99px;background:var(--green);color:#fff;font-size:9px;font-weight:850}.training-label.declined{background:var(--red)}.training-network .network{height:285px}.training-status{min-height:35px;margin:5px auto 0;padding:8px 10px;border-radius:8px;background:var(--blue-soft);color:#174f69;text-align:center;font-size:10px}.training-summary{display:flex;justify-content:center;gap:20px;margin-top:7px;color:var(--muted);font-size:9px}.training-summary b{color:var(--ink);font-size:11px}.connection.flowing{stroke-dasharray:7 8;animation:flowLine .55s linear infinite}.connection.backward{stroke:var(--red)!important;stroke-dasharray:7 8;animation:flowLine .55s linear infinite reverse}.node.output.loss-pulse circle{animation:lossPulse .45s ease-in-out 2}@keyframes flowLine{to{stroke-dashoffset:-30}}@keyframes lossPulse{50%{stroke-width:6;stroke:var(--amber);filter:drop-shadow(0 0 9px var(--amber))}}
@media(max-width:800px){.canvas{min-height:600px}.training-layout,.sandbox-grid{grid-template-columns:1fr}.recap{grid-template-columns:repeat(2,1fr)}}
@media(max-width:540px){.shell{width:min(100% - 18px,1180px);padding-top:16px}.chapter{padding:9px 5px;text-align:center;font-size:8px}.chapter:before,.scene-count{display:none}.story-head{padding:15px}.canvas{min-height:670px;padding:16px 11px}.controls{align-items:stretch;flex-direction:column}.control-group{display:grid;grid-template-columns:1fr 1fr}.progress{max-width:none}.applicant-grid,.input-scene,.stats,.compare{grid-template-columns:1fr 1fr}.network{height:430px}.recap{grid-template-columns:1fr}}

<style>.input-icon{font-size:20px}.feature-symbol{margin-right:4px;font-size:1.15em}.node.input text{font-size:17px}.node.output circle{fill:#fff;stroke:var(--muted)}.node.output text{fill:var(--ink)}.explain{border:1px solid #b9ddeb;border-left:4px solid var(--blue);text-align:left;line-height:1.45}.explain strong{color:var(--ink)}.connection.unweighted{pointer-events:none;stroke-dasharray:520;stroke-dashoffset:520;animation:drawConnection .55s ease forwards;animation-delay:var(--draw-delay)}.flow-token{fill:#fff;stroke:var(--green);stroke-width:2;filter:drop-shadow(0 0 4px #57a979);pointer-events:none}.flow-token.backward{fill:var(--red);stroke:#fff;filter:drop-shadow(0 0 4px var(--red))}@keyframes drawConnection{to{stroke-dashoffset:0}}.applicant{max-width:940px}.applicant-grid,.input-scene{grid-template-columns:repeat(5,1fr);max-width:940px}.input-card:nth-child(5){animation-delay:.6s}@media(max-width:800px){.applicant-grid,.input-scene{grid-template-columns:repeat(3,1fr)}}@media(max-width:540px){.applicant-grid,.input-scene{grid-template-columns:repeat(2,1fr)}}</style>

<body>
<main class="shell">
  <div class="eyebrow">Neural Network Foundations</div>
  <h1>How does a neural network learn?</h1>
  <p class="intro">Explore a network one idea at a time. Follow applicant information through a designed arrangement of units and weighted connections, watch predictions change with training, and consider how training data shapes results.</p>
  <nav class="chapter-bar" aria-label="Lesson chapters">
    <button class="chapter" data-chapter="0" data-number="1">Observe</button><button class="chapter" data-chapter="1" data-number="2">Topology</button><button class="chapter" data-chapter="2" data-number="3">Train</button><button class="chapter" data-chapter="3" data-number="4">Reflect</button>
  </nav>
  <section class="story">
    <header class="story-head"><div><div class="scene-kicker" id="sceneKicker"></div><h2 class="scene-title" id="sceneTitle"></h2><p class="scene-copy" id="sceneCopy"></p></div><span class="scene-count" id="sceneCount"></span></header>
    <div class="canvas"><div id="sceneContent"></div></div>
  </section>
  <div class="controls"><div class="control-group"><button id="prevBtn">← Back</button><button id="restartBtn">Restart</button></div><div class="progress" role="progressbar" aria-label="Lesson progress" aria-valuemin="1"><div class="progress-fill" id="progressFill"></div></div><button class="primary" id="nextBtn">Next →</button></div>
  <div class="sr-only" id="liveStatus" aria-live="polite"></div>
</main>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const featureDefs=[['Age',18,75,' yrs'],['Income',20,180,'k'],['Credit',300,850,''],['Employed',0,35,' yrs'],['Loan amount',5,100,'k']];
const featureIcons=['🎂','$','★','💼','🏦'];
const initialValues=[34,78,710,7,35],initialWeights=[[.08,.12,.05],[.72,.55,.48],[.95,.78,.88],[.28,.35,.18],[-.55,-.42,-.50]],initialOut=[.65,.90,.58];
const scenes=[
 {chapter:0,kicker:'Observe · human judgment',title:'What would you predict?',copy:'Inspect one fictional applicant and make a prediction before seeing the network.',kind:'predict'},
 {chapter:0,kicker:'Observe · numerical signals',title:'Applicant information becomes inputs',copy:'A network receives numerical signals—not a story about a person.',kind:'inputs'},
 {chapter:1,kicker:'Topology · network design',title:'The design sets the layers and units',copy:'Before any prediction or training begins, the network is designed with three hidden units and one output unit.',kind:'topology'},
 {chapter:1,kicker:'Topology · hidden signals',title:'Each hidden unit responds differently',copy:'With the weighted topology in place, each hidden unit combines the same five inputs into its own signal.',kind:'signals'},
 {chapter:1,kicker:'Topology · forward pass',title:'Hidden-unit signals become a prediction',copy:'Connections to the output complete the designed topology, allowing signals to move through the network.',kind:'forward'},
 {chapter:2,kicker:'Train · feedback',title:'Compare the prediction with the training label',copy:'The difference supplies an error signal the network can use to learn.',kind:'loss'},
 {chapter:2,kicker:'Train · adjust connections',title:'Error changes the connection weights',copy:'Backpropagation works backward to identify and slightly adjust contributing connections.',kind:'adjust'},
 {chapter:2,kicker:'Train · repeated examples',title:'Learning accumulates across many applicants',copy:'Several varied examples gradually change the same network and reduce its error.',kind:'many'},
 {chapter:3,kicker:'Reflect · responsible use',title:'Training data shapes what the model learns',copy:'Lower training error does not automatically make a model fair or appropriate.',kind:'bias'},
 {chapter:3,kicker:'Reflect · explore',title:'Test the complete network',copy:'Use the sandbox to change inputs, run a forward pass, and train on additional fictional examples.',kind:'sandbox'}
];
const state={scene:0,epoch:0,timers:new Set(),choice:null,values:[...initialValues],weights:initialWeights.map(r=>[...r]),out:[...initialOut],hiddenBias:[-.65,-.65,-.65],outBias:-.4,trained:0};
const sigmoid=x=>1/(1+Math.exp(-x));
const norm=(v,i)=>(v-featureDefs[i][1])/(featureDefs[i][2]-featureDefs[i][1]);
function calculate(values=state.values){const x=values.map(norm),hidden=[0,1,2].map(j=>sigmoid(x.reduce((s,v,i)=>s+v*state.weights[i][j],state.hiddenBias[j]))),prob=sigmoid(hidden.reduce((s,v,j)=>s+v*state.out[j],state.outBias));return{x,hidden,prob}}
function labelFor(values,biased=false){const x=values.map(norm),affordability=1-Math.min(1,values[4]/Math.max(1,values[1]));let score=x[2]*.43+x[1]*.22+x[3]*.14+x[0]*.05+affordability*.16;if(biased&&x[0]<.28)score-=.22;return score>=.56?1:0}
function train(values,target,lr=.22){const r=calculate(values),dOut=r.prob-target,oldOut=[...state.out];state.out=state.out.map((w,j)=>w-lr*dOut*r.hidden[j]);state.outBias-=lr*dOut;state.weights=state.weights.map((row,i)=>row.map((w,j)=>w-lr*(dOut*oldOut[j]*r.hidden[j]*(1-r.hidden[j]))*r.x[i]));state.hiddenBias=state.hiddenBias.map((b,j)=>b-lr*dOut*oldOut[j]*r.hidden[j]*(1-r.hidden[j]));state.trained++;return{before:r.prob,after:calculate(values).prob}}
function randomApplicant(){return featureDefs.map((f,i)=>Math.round(f[1]+Math.random()*(f[2]-f[1])))}
function featureNameHTML(i){return `<span class="feature-symbol" aria-hidden="true">${featureIcons[i]}</span>${featureDefs[i][0]}`}
function formatFeatureValue(v,i){return `${i===1||i===4?'$':''}${v}${featureDefs[i][3]}`}
function applicantHTML(values=state.values){return `<div class="applicant-grid">${values.map((v,i)=>`<div class="datum"><b>${featureNameHTML(i)}</b><strong>${formatFeatureValue(v,i)}</strong></div>`).join('')}</div>`}
function networkSVG(mode='full',interactive=false){const ins=[54,122,190,258,326].map(y=>({x:75,y})),hid=[{x:315,y:95},{x:315,y:190},{x:315,y:285}],out={x:530,y:190},r=calculate();let s='<svg class="network" viewBox="0 0 600 380" role="img" aria-label="Five inputs, three hidden units, and one output"><text class="layer-label" x="75" y="22">Inputs</text><text class="layer-label" x="315" y="22">Hidden Layer</text><text class="layer-label" x="530" y="22">Output Layer</text>';
 if(!['inputs','topology'].includes(mode))ins.forEach((a,i)=>hid.forEach((b,j)=>{const w=state.weights[i][j];s+=`<line class="connection" ${interactive?'tabindex="0" role="button"':''} data-source="${featureDefs[i][0]}" data-target="Unit ${j+1}" data-weight="${w}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${w>=0?'var(--green)':'var(--red)'}" stroke-width="${1+Math.abs(w)*5}" opacity=".62"/>`}));if(['full','forward','adjust','sandbox'].includes(mode))hid.forEach((a,j)=>{const w=state.out[j];s+=`<line class="connection" ${interactive?'tabindex="0" role="button"':''} data-source="Unit ${j+1}" data-target="Prediction" data-weight="${w}" x1="${a.x}" y1="${a.y}" x2="${out.x}" y2="${out.y}" stroke="${w>=0?'var(--green)':'var(--red)'}" stroke-width="${1+Math.abs(w)*5}" opacity=".68"/>`});ins.forEach((n,i)=>s+=nodeSVG(n,'input',featureDefs[i][0],featureIcons[i]));if(mode!=='inputs')hid.forEach((n,j)=>s+=nodeSVG(n,'hidden',`Hidden unit ${j+1}`,`Unit ${j+1}`,mode==='topology'?null:r.hidden[j]));if(['topology','connections','full','forward','adjust','sandbox'].includes(mode))s+=nodeSVG(out,'output','Output unit',['topology','connections'].includes(mode)?'Output':`${Math.round(r.prob*100)}%`);return s+'</svg>'}
function nodeSVG(n,type,title,display,meter=null){const bar=meter===null?'':`<rect class="meter-bg" x="-20" y="12" width="40" height="5" rx="3"/><rect class="meter-fill" x="-20" y="12" width="${Math.max(2,meter*40)}" height="5" rx="3"/>`;return `<g transform="translate(${n.x} ${n.y})"><g class="node ${type}" tabindex="0" role="button" aria-label="Explain ${title}" data-title="${title}"><circle r="${type==='output'?40:type==='input'?27:32}"/><text y="${meter===null?4:0}">${display}</text>${bar}</g></g>`}
function networkBlock(mode='full',interactive=false,note=''){return `<div class="network-wrap">${networkSVG(mode,interactive)}<div class="legend"><span><i></i>Raises signal</span><span><i class="red"></i>Lowers signal</span><span>Thicker = stronger</span></div><div class="explain" id="networkExplain">${note||'<strong>Explore the network.</strong> Select a node or connection to see what it contributes.'}</div></div>`}
function renderContent(scene){const p=Math.round(calculate().prob*100),target=labelFor(state.values);if(scene.kind==='predict')return `<div class="applicant"><div class="panel-title">Fictional applicant</div>${applicantHTML()}<div class="choice-row"><button data-choice="0">Predict decline</button><button data-choice="1">Predict approve</button></div><div class="explain" id="choiceStatus"><strong>Your turn.</strong> Commit to a prediction now; you will compare it with the network after its topology is revealed.</div></div>`;
 if(scene.kind==='inputs')return `<div class="input-scene">${state.values.map((v,i)=>`<div class="input-card"><span class="input-icon" aria-hidden="true">${featureIcons[i]}</span><b>${featureDefs[i][0]}</b><div>${formatFeatureValue(v,i)}</div></div>`).join('')}</div><div class="note"><strong>Input</strong> means information represented as a number. It is not yet a prediction.</div>`;
 if(scene.kind==='topology')return `<div class="network-wrap">${networkSVG('topology')}<div class="legend"><span><i></i>Raises signal</span><span><i class="red"></i>Lowers signal</span><span>Thicker = stronger</span></div><div class="explain" id="networkExplain"><strong>Architecture first.</strong> The five inputs, three hidden units, and output are fixed before the model runs. Watch the connections appear next.</div></div>`;
 if(scene.kind==='signals')return networkBlock('connections',true,'<strong>Read the responses.</strong> Each unit combines all five inputs with different weights. Its bar shows the resulting signal strength for this applicant.');
 if(scene.kind==='forward')return `${networkBlock('forward',true,`<strong>Forward pass complete.</strong> The network estimates ${p}% approval. ${state.choice===null?'No human prediction was recorded for comparison.':`Your prediction was ${state.choice?'approve':'decline'}.`}`)}<div class="note neutral"><strong>Remember:</strong> useful hidden-unit calculations do not necessarily correspond to concepts people can name.</div>`;
 if(scene.kind==='loss')return `<div class="compare"><div class="compare-card"><div class="panel-title">Network prediction</div><strong>${p}% approval</strong><div class="bar-label"><span>Predicted approval</span><span>${p}%</span></div><div class="bar-track"><div class="bar-fill" style="width:${p}%"></div></div></div><div class="compare-card"><div class="panel-title">Training label</div><strong>${target?'Approved':'Declined'}</strong><div class="bar-label"><span>Prediction error</span><span>${Math.round(Math.abs(target-p/100)*100)} points</span></div><div class="bar-track"><div class="bar-fill error" style="width:${Math.abs(target-p/100)*100}%"></div></div></div></div><div class="note"><strong>That gap becomes feedback.</strong> The label tells the network which direction to adjust, but a dataset label is not automatically fair or correct.</div>`;
 if(scene.kind==='adjust')return `<div id="adjustScene">${networkBlock('adjust',false,'<strong>Follow the error backward.</strong> The network traces which connections contributed, then nudges their weights before predicting again.')}<div class="choice-row"><button class="primary" id="adjustBtn">Adjust connections</button></div></div>`;
 if(scene.kind==='many')return `<div class="training-scene"><div class="training-phases" aria-label="Training cycle"><div class="training-phase" id="manyForward"><b>1 · Forward pass</b>Make a prediction</div><div class="training-phase error" id="manyLoss"><b>2 · Check error</b>Compare with label</div><div class="training-phase" id="manyBack"><b>3 · Adjust weights</b>Send feedback backward</div></div><div class="training-data" id="manyExample" aria-live="polite"></div><div class="training-network" id="trainingNetwork">${networkSVG('full')}</div><div class="training-status" id="manyStatus">Preparing the first training example…</div><div class="training-summary"><span><b id="manyCount">0</b> examples</span><span><b id="manyCorrect">—</b> accuracy</span><span><b id="manyError">—</b> current error</span></div></div>`;
 if(scene.kind==='bias')return `<div class="compare"><div class="compare-card"><div class="panel-title">Balanced training set</div><h3>Varied age groups represented</h3><div class="bar-label"><span>Training error</span><span>Lower</span></div><div class="bar-track"><div class="bar-fill" style="width:28%"></div></div><p>Predictions mainly follow the stated qualification signals.</p></div><div class="compare-card" style="border-color:var(--red)"><div class="panel-title">Biased training set</div><h3>Younger applicants penalized</h3><div class="bar-label"><span>Training error</span><span>Also lower</span></div><div class="bar-track"><div class="bar-fill error" style="width:24%"></div></div><p>The model can reproduce unfair labels while appearing accurate.</p></div></div><div class="note"><strong>Accuracy, fairness, and appropriate use are different questions.</strong></div>`;
 return `<div class="sandbox"><div class="sandbox-grid"><div class="sandbox-panel"><div id="sandboxInputs"></div><div class="sandbox-actions"><button class="primary" id="evaluateBtn">Forward pass</button><button id="trainNextBtn">Train next</button><button id="trainBatchBtn">Train 25</button><button id="resetModelBtn">Reset</button></div><details><summary>Training options</summary><div class="field"><label for="datasetType">Dataset</label><select id="datasetType"><option value="balanced">Balanced</option><option value="biased">Biased</option></select></div><div class="field"><label for="cycleMode">Learning cycle</label><select id="cycleMode"><option value="auto">Automatic</option><option value="step">Show forward, error, and adjustment</option></select></div><div class="field"><label for="trainingSpeedOption">Animation speed</label><select id="trainingSpeedOption"><option value="900">Slow</option><option value="550" selected>Normal</option><option value="250">Fast</option></select></div></details><div class="sandbox-result"><span id="sandboxStats">${state.trained} examples trained</span><b id="sandboxPrediction">${p}% approval</b></div></div><div class="sandbox-panel" id="sandboxNetwork">${networkBlock('sandbox',true,'<strong>Try a counterfactual.</strong> Change one input at a time, run the forward pass, and watch which signals and prediction move.')}</div></div><div class="disclaimer">Fictional teaching example. Real lending systems require legal review, validation, broader evidence, and human accountability.</div></div>`}
function animateTopology(){const svg=$('.network'),box=$('#networkExplain'),inputY=[54,122,190,258,326],hiddenY=[95,190,285],lines=[];inputY.forEach((y,i)=>hiddenY.forEach((hy,j)=>{const line=document.createElementNS('http://www.w3.org/2000/svg','line'),w=state.weights[i][j];line.setAttribute('class','connection unweighted');line.setAttribute('x1','75');line.setAttribute('y1',y);line.setAttribute('x2','315');line.setAttribute('y2',hy);line.setAttribute('stroke','var(--muted)');line.setAttribute('stroke-width','2');line.setAttribute('opacity','.55');line.dataset.source=featureDefs[i][0];line.dataset.target=`Unit ${j+1}`;line.dataset.weight=w;line.style.setProperty('--draw-delay',`${lines.length*.055}s`);svg.insertBefore(line,svg.querySelector('.node')?.parentElement||null);lines.push(line)}));schedule(()=>{box.innerHTML='<strong>Now apply the weights.</strong> Each neutral connection receives a learned direction and strength.';lines.forEach((line,index)=>schedule(()=>{const w=+line.dataset.weight;line.classList.remove('unweighted');line.setAttribute('stroke',w>=0?'var(--green)':'var(--red)');line.setAttribute('stroke-width',1+Math.abs(w)*5);line.setAttribute('opacity','.65')},index*35));schedule(()=>{lines.forEach(line=>{line.setAttribute('tabindex','0');line.setAttribute('role','button')});box.innerHTML='<strong>Weighted topology complete.</strong> Color shows whether a connection raises or lowers a signal; thickness shows how strongly.';bindNetwork()},lines.length*35+120)},1000)}
function bindScene(scene){bindNetwork();if(scene.kind==='topology')animateTopology();if(scene.kind==='predict')$$('[data-choice]').forEach(b=>b.onclick=()=>{state.choice=+b.dataset.choice;$$('[data-choice]').forEach(x=>x.classList.toggle('chosen',x===b));$('#choiceStatus').innerHTML=`<strong>Prediction recorded:</strong> ${state.choice?'Approve':'Decline'}. Keep it in mind—the network may reach a different answer.`;});if(scene.kind==='adjust')$('#adjustBtn').onclick=()=>{const button=$('#adjustBtn'),target=labelFor(state.values),before=calculate().prob;button.disabled=true;$('#networkExplain').innerHTML='<strong>Backpropagation.</strong> Red error particles move from the output toward every connection that contributed.';animateNetworkParticles('#adjustScene',true,()=>{train(state.values,target);$('#adjustScene .network-wrap').outerHTML=networkBlock('adjust',false,`<strong>One learning step complete.</strong> The estimate moved from ${Math.round(before*100)}% to ${Math.round(calculate().prob*100)}% after the weights shifted toward the label.`);bindNetwork()},420)};if(scene.kind==='many')runManyExamples();if(scene.kind==='sandbox')bindSandbox()}
function bindNetwork(){const box=$('#networkExplain');if(!box)return;$$('.connection').forEach(line=>{const explain=()=>{box.textContent=`${line.dataset.source} → ${line.dataset.target}: weight ${(+line.dataset.weight).toFixed(2)}. This connection ${+line.dataset.weight>=0?'raises':'lowers'} the next signal.`};line.onclick=explain;line.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();explain()}}});$$('.node').forEach(n=>n.onclick=()=>{box.textContent=n.classList.contains('hidden')?'This hidden unit combines all five inputs, applies an activation function, and sends a signal between 0 and 1.':n.classList.contains('output')?'The output combines the three hidden-unit signals into the prediction.':'This input carries one applicant value into the network.'})}
function schedule(fn,ms){const epoch=state.epoch,id=setTimeout(()=>{state.timers.delete(id);if(epoch===state.epoch)fn()},ms);state.timers.add(id)}function clearAnimations(){state.timers.forEach(clearTimeout);state.timers.clear()}
function compactApplicantHTML(values,target){return values.map((v,i)=>`<span class="training-datum"><b>${featureNameHTML(i)}</b>${formatFeatureValue(v,i)}</span>`).join('')+`<span class="training-label ${target?'':'declined'}">Label: ${target?'Approved':'Declined'}</span>`}
function setManyPhase(active){[$('#manyForward'),$('#manyLoss'),$('#manyBack')].forEach((phase,i)=>phase.classList.toggle('active',i===active))}
function refreshTrainingNetwork(){const host=$('#trainingNetwork');if(host)host.innerHTML=networkSVG('full')}
function runManyExamples(){let count=0,correct=0;const step=()=>{if(count>=8){for(let i=0;i<17;i++){const v=randomApplicant();train(v,labelFor(v))}refreshTrainingNetwork();setManyPhase(-1);$('#manyCount').textContent='25';$('#manyStatus').textContent='Fast batch complete · the same network accumulated weight updates from 25 examples.';return}const v=randomApplicant(),target=labelFor(v),before=calculate(v).prob,error=Math.abs(target-before);count++;correct+=(before>=.5)===!!target;$('#manyExample').innerHTML=compactApplicantHTML(v,target);$('#manyCount').textContent=count;$('#manyCorrect').textContent=Math.round(correct/count*100)+'%';$('#manyError').textContent=Math.round(error*100)+'%';refreshTrainingNetwork();setManyPhase(0);$('#manyStatus').textContent=`Example ${count} · forward particles carry the inputs toward a ${Math.round(before*100)}% approval estimate.`;animateNetworkParticles('#trainingNetwork',false,()=>{setManyPhase(1);$('#trainingNetwork .node.output').classList.add('loss-pulse');$('#manyStatus').textContent=`Check error · prediction ${Math.round(before*100)}% compared with label ${target?'Approved':'Declined'}.`;schedule(()=>{setManyPhase(2);$('#manyStatus').textContent='Red feedback particles move backward before the weights adjust.';animateNetworkParticles('#trainingNetwork',true,()=>{train(v,target);refreshTrainingNetwork();step()},190)},180)},190)};step()}
function setSandboxBusy(busy){$$('#evaluateBtn,#trainNextBtn,#trainBatchBtn,#resetModelBtn,#sandboxInputs input,#sandboxInputs select').forEach(control=>control.disabled=busy)}
function animateNetworkParticles(root,backward,done,speedOverride=null){const svg=$(`${root} .network`),lines=$$(`${root} .connection`),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,chosenSpeed=speedOverride??+($('#trainingSpeedOption')?.value||550),duration=reduced?1:Math.max(150,chosenSpeed),stagger=reduced?0:Math.max(7,chosenSpeed/22),ordered=backward?[...lines].reverse():lines;ordered.forEach((line,index)=>schedule(()=>{const token=document.createElementNS('http://www.w3.org/2000/svg','circle'),x1=+line.getAttribute('x1'),y1=+line.getAttribute('y1'),x2=+line.getAttribute('x2'),y2=+line.getAttribute('y2');token.setAttribute('r','5');token.setAttribute('class',`flow-token${backward?' backward':''}`);svg.appendChild(token);token.animate([{transform:`translate(${backward?x2:x1}px,${backward?y2:y1}px)`},{transform:`translate(${backward?x1:x2}px,${backward?y1:y2}px)`}],{duration,fill:'forwards'}).onfinish=()=>token.remove()},index*stagger));schedule(done,duration+(lines.length-1)*stagger+40)}
function animateSandboxParticles(backward,done){animateNetworkParticles('#sandboxNetwork',backward,done)}
function loadSandboxApplicant(values){state.values=[...values];$$('[data-input]').forEach(input=>{const i=+input.dataset.input;input.value=state.values[i];$(`#sv${i}`).textContent=formatFeatureValue(state.values[i],i)})}
function runSandboxForward(){setSandboxBusy(true);$('#networkExplain').innerHTML='<strong>Forward pass.</strong> Signals travel from the five inputs, through the hidden units, to the output.';animateSandboxParticles(false,()=>{$('#sandboxNetwork .node.output').classList.add('loss-pulse');$('#networkExplain').innerHTML=`<strong>Prediction reached.</strong> The output combines the hidden signals into a ${Math.round(calculate().prob*100)}% approval estimate.`;setSandboxBusy(false)})}
function runSandboxTraining(batchSize=1){const biased=$('#datasetType').value==='biased',values=randomApplicant(),target=labelFor(values,biased),before=calculate(values).prob;loadSandboxApplicant(values);updateSandbox();setSandboxBusy(true);$('#networkExplain').innerHTML='<strong>1 · Forward pass.</strong> The new labeled applicant moves through the current weights.';animateSandboxParticles(false,()=>{$('#sandboxNetwork .node.output').classList.add('loss-pulse');$('#networkExplain').innerHTML=`<strong>2 · Check error.</strong> Prediction ${Math.round(before*100)}% is compared with the ${target?'Approved':'Declined'} label.`;const delay=Math.max(180,+$('#trainingSpeedOption').value/2);schedule(()=>{$('#networkExplain').innerHTML='<strong>3 · Backpropagation.</strong> Red feedback particles carry the error backward through every contributing connection.';animateSandboxParticles(true,()=>{train(values,target);for(let i=1;i<batchSize;i++){const v=randomApplicant();train(v,labelFor(v,biased))}updateSandbox();$('#networkExplain').innerHTML=`<strong>${batchSize===1?'Training example':'Training batch'} complete.</strong> The updated line thicknesses show the network’s new weights.`;setSandboxBusy(false)})},delay)})}
function bindSandbox(){const host=$('#sandboxInputs');host.innerHTML=featureDefs.map((f,i)=>`<div class="field"><label><span>${featureNameHTML(i)}</span><output id="sv${i}">${formatFeatureValue(state.values[i],i)}</output></label><input data-input="${i}" type="range" min="${f[1]}" max="${f[2]}" value="${state.values[i]}"></div>`).join('');$$('[data-input]').forEach(input=>input.oninput=()=>{const i=+input.dataset.input;state.values[i]=+input.value;$(`#sv${i}`).textContent=formatFeatureValue(state.values[i],i);updateSandbox()});$('#evaluateBtn').onclick=runSandboxForward;$('#trainNextBtn').onclick=()=>runSandboxTraining(1);$('#trainBatchBtn').onclick=()=>runSandboxTraining(25);$('#resetModelBtn').onclick=()=>{resetModel();renderScene(9,false)}}
function updateSandbox(){const p=Math.round(calculate().prob*100);$('#sandboxPrediction').textContent=p+'% approval';$('#sandboxStats').textContent=state.trained+' examples trained';$('#sandboxNetwork').innerHTML=networkBlock('sandbox',true,'<strong>Prediction refreshed.</strong> These signal bars and the output now reflect the current applicant and latest learned weights.');bindNetwork()}
function resetModel(){state.values=[...initialValues];state.weights=initialWeights.map(r=>[...r]);state.out=[...initialOut];state.hiddenBias=[-.65,-.65,-.65];state.outBias=-.4;state.trained=0}
function renderScene(index,announce=true){clearAnimations();state.epoch++;state.scene=Math.max(0,Math.min(scenes.length-1,index));const scene=scenes[state.scene];$('#sceneKicker').textContent=scene.kicker;$('#sceneTitle').textContent=scene.title;$('#sceneCopy').textContent=scene.copy;$('#sceneCount').textContent=`Scene ${state.scene+1} of ${scenes.length}`;const content=$('#sceneContent');content.classList.remove('scene-content');void content.offsetWidth;content.innerHTML=renderContent(scene);content.classList.add('scene-content');$$('.chapter').forEach(x=>x.classList.toggle('active',+x.dataset.chapter===scene.chapter));$('#prevBtn').disabled=state.scene===0;$('#nextBtn').disabled=state.scene===scenes.length-1;$('#nextBtn').textContent=state.scene===scenes.length-1?'Lesson complete':'Next →';$('#progressFill').style.width=`${(state.scene+1)/scenes.length*100}%`;$('.progress').setAttribute('aria-valuemax',scenes.length);$('.progress').setAttribute('aria-valuenow',state.scene+1);bindScene(scene);if(announce)$('#liveStatus').textContent=`Scene ${state.scene+1}: ${scene.title}. ${scene.copy}`}
$('#prevBtn').onclick=()=>renderScene(state.scene-1);$('#nextBtn').onclick=()=>{if(state.scene<scenes.length-1)renderScene(state.scene+1)};$('#restartBtn').onclick=()=>{resetModel();state.choice=null;renderScene(0)};$$('.chapter').forEach(b=>b.onclick=()=>renderScene(scenes.findIndex(s=>s.chapter===+b.dataset.chapter)));document.addEventListener('keydown',e=>{if(e.target.matches('button,input,select,[role=button]'))return;if(e.key==='ArrowRight'&&state.scene<scenes.length-1)renderScene(state.scene+1);if(e.key==='ArrowLeft'&&state.scene>0)renderScene(state.scene-1)});document.addEventListener('visibilitychange',()=>{if(document.hidden)clearAnimations()});renderScene(0,false);
</script>
