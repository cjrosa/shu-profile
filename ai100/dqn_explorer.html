<body>
<main class="shell">
 <div class="eyebrow">Deep Reinforcement Learning</div>
 <h1>How a DQN Learns Action Values</h1>
 <p class="intro">Teach a computer-controlled agent to play Breakout. Follow what it sees, how it estimates paddle-action values, and how experience improves its future decisions.</p>
 <nav class="chapter-bar" aria-label="Lesson chapters"><button type="button" class="chapter active" data-number="1" data-chapter="0">Scale</button><button type="button" class="chapter" data-number="2" data-chapter="1">Represent</button><button type="button" class="chapter" data-number="3" data-chapter="2">Learn</button><button type="button" class="chapter" data-number="4" data-chapter="3">Act</button></nav>
 <section class="story" aria-labelledby="sceneTitle"><header class="story-head"><div><div class="scene-kicker" id="sceneKicker"></div><h2 class="scene-title" id="sceneTitle"></h2><p class="scene-copy" id="sceneCopy"></p></div><div class="scene-count" id="sceneCount"></div></header><div class="canvas"><div class="scene-content" id="sceneContent"></div></div></section>
 <div class="controls"><div class="control-group"><button id="prevBtn" type="button">← Previous</button><button id="nextBtn" class="primary" type="button">Next →</button></div><div class="progress" role="progressbar" aria-label="Lesson progress" aria-valuemin="1" aria-valuemax="10" aria-valuenow="1"><div class="progress-fill" id="progressFill"></div></div><div class="control-group"><button id="restartBtn" type="button">Restart</button></div></div>
 <div class="sr-only" id="liveStatus" aria-live="polite"></div>
</main>
<script>
const scenes=[
 {chapter:0,kicker:'Scale · environment',title:'Teach a computer-controlled agent to play Breakout',copy:'The computer chooses how to move the paddle, observes what happens, and gradually learns which actions improve gameplay.',kind:'environment'},
 {chapter:0,kicker:'Scale · pixel-state explosion',title:'The tabular idea is right—but exact rows do not scale',copy:'Breakout has far too many pixel configurations to visit, store, and learn independently, so a DQN estimates the same action values.',kind:'scaleDqn'},
 {chapter:1,kicker:'Represent · CNN hierarchy',title:'Convolutional layers turn pixels into useful evidence',copy:'Shared filters scan local regions, build activation maps, and combine simple features into spatial relationships.',kind:'cnn'},
 {chapter:1,kicker:'Represent · neural action head',title:'Dense neural layers convert visual evidence into Q-values',copy:'Learned connections combine the CNN representation and produce separate estimates for Left, Stay, and Right.',kind:'network'},
 {chapter:2,kicker:'Learn · experience replay',title:'The agent stores transitions, then learns from a sampled batch',copy:'Replay breaks up consecutive experience and lets useful moments participate in more than one update.',kind:'replay'},
 {chapter:2,kicker:'Learn · stable target',title:'A separate target network changes less often',copy:'The online network learns each update; periodically, its weights are copied to the target network.',kind:'target'},
 {chapter:2,kicker:'Learn · Bellman target and error',title:'A target turns future value into a learning signal',copy:'The online prediction is compared with reward plus the target network’s best next-state estimate.',kind:'bellman'},
 {chapter:3,kicker:'Act · epsilon-greedy decision',title:'The DQN balances exploration with exploitation',copy:'Most decisions use the largest estimated action value, while some deliberately explore another action.',kind:'act'},
 {chapter:3,kicker:'Act · complete cycle',title:'Every action creates the next learning opportunity',copy:'Frames become values, values guide an action, and the resulting transition returns through replay and learning.',kind:'loop'},
 {chapter:3,kicker:'Act · recap',title:'DQN replaces exact lookup with learned generalization',copy:'The network can relate similar pixel states, but its estimates remain approximate and depend on data and stable training.',kind:'recap'}
];
const scripted={frames:[{x:39,y:69,p:42},{x:43,y:64,p:42},{x:47,y:59,p:42},{x:51,y:54,p:42}],q:{left:0.82,stay:0.31,right:1.24},epsilon:.10,decision:'right',transition:{action:'Right',reward:1,terminal:false},gamma:.90,nextMax:1.40,prediction:1.24,target:2.26,td:1.02,replay:[['s₁','Left','0','s₂','false'],['s₂','Stay','0','s₃','false'],['s₃','Right','+1','s₄','false'],['s₄','Right','0','s₅','false'],['s₅','Left','−1','—','true'],['s₆','Stay','0','s₇','false']]};
const state={scene:0,phase:0,epoch:0,timers:new Set(),targetSynced:false,raf:null,raceFrames:1,raceStates:1,raceMode:'raw',racePaused:false,raceSamples:[],raceHistory:[]};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function board(frame=scripted.frames[3],label='Breakout frame',advanced=false){const gone=advanced?[2,3,11]:[2,11];return `<div class="breakout" style="--ball-x:${frame.x}%;--ball-y:${frame.y}%;--paddle:${advanced?57:frame.p}%" role="img" aria-label="${label}: ball at ${frame.x} percent across and ${frame.y} percent down, paddle near ${advanced?57:frame.p} percent"><div class="bricks">${Array.from({length:24},(_,i)=>`<i class="brick ${gone.includes(i)?'gone':''}"></i>`).join('')}</div><i class="trail"></i><i class="ball"></i><i class="paddle"></i><span class="board-label">vector scene</span></div>`}
function environment(){const game=board(scripted.frames[3],'Live Breakout demonstration').replace('class="breakout"','class="breakout demo"').replace('role="img"','id="demoBoard" role="img"');return `<div class="environment-layout"><div><div class="game-stage">${game}<span class="board-callout agent" data-board-label="agent">Computer observes the board</span><span class="board-callout state" data-board-label="state">Current visual state</span><span class="board-callout action" data-board-label="action">← Paddle actions →</span><span class="board-callout reward-label" data-board-label="reward">Brick hit · reward +1</span><span class="board-callout terminal" data-board-label="terminal">Ball lost · episode ends</span></div><div class="game-readout"><span>Action <b id="demoAction">Stay</b></span><span>Reward <b id="demoReward">0</b></span><span>Bricks <b id="demoBricks">22</b></span></div><div class="note info">The ball follows game physics while the computer selects paddle movements.</div></div><div><div class="learn-callout"><strong>What the agent needs to learn?</strong>Which paddle action is likely to produce the greatest expected long-term reward in each game situation.<br><br><b>Gameplay impact:</b> those estimates guide every computer-selected move, helping it meet the ball, keep the rally alive, influence the return path, and clear more bricks over time.</div><h3 class="terms-title">Terms</h3><div class="term-pills" role="group" aria-label="Relate reinforcement-learning terms to the game"><button class="term-pill" type="button" data-term="agent" aria-pressed="false">Agent</button><button class="term-pill" type="button" data-term="state" aria-pressed="false">State</button><button class="term-pill" type="button" data-term="action" aria-pressed="false">Actions</button><button class="term-pill" type="button" data-term="reward" aria-pressed="false">Reward</button><button class="term-pill" type="button" data-term="terminal" aria-pressed="false">Terminal</button></div><div class="term-detail" id="termDetail"><b>Select a term</b>Choose a pill to connect the reinforcement-learning vocabulary to the live gameboard.</div></div></div>`}
function representationDetail(mode='raw'){const cells='<i></i>'.repeat(64);if(mode==='raw')return `<h3>Raw pixel representation · fixed input size</h3><div class="raw-stack">${[0,1,2,3].map(i=>`<div><div class="raw-frame" data-raw-frame="${i}" aria-label="Processed frame ${i+1} of four">${cells}</div><div class="stage-label">${i===3?'t':`t−${3-i}`}</div></div>`).join('')}</div><div class="representation-caption">Four 84 × 84 grayscale frames always contain 28,224 values. These simplified 8 × 8 previews update from the live board to make the temporal stack visible.</div>`;if(mode==='factors')return `<h3>Game factors · concepts latent in the pixels</h3><div class="factor-flow"><span>Ball position</span><span>Direction and speed</span><span>Paddle position</span><span>Exact brick pattern</span></div><div class="representation-caption">These are not manually entered columns. A CNN can learn recurring visual evidence for them across many different frames.</div>`;if(mode==='table')return `<h3>Hypothetical exact-state Q-table</h3><div class="table-preview"><div class="stream-row stream-head"><b>State</b><b>Left</b><b>Stay</b><b>Right</b></div>${[1,2,3,4].map(i=>`<div class="stream-row ${i===4?'new':''}"><span>S${Math.max(1,state.raceStates-4+i)}</span><span>${(.1+i*.07).toFixed(2)}</span><span>${(.06+i*.04).toFixed(2)}</span><span>${(.13+i*.09).toFixed(2)}</span></div>`).join('')}</div><div class="representation-caption">Each newly encountered exact configuration needs another independent row. Similar situations do not automatically share what was learned.</div>`;return `<h3>DQN representation · shared learned features</h3><div class="feature-preview"><span class="feature-node">Edges</span><span class="feature-node">Motion</span><span class="feature-node">Ball–paddle relation</span><span class="feature-node">Brick geometry</span><span class="feature-node">Q-values</span></div><div class="representation-caption">Every state passes through the same learned weights. Updating useful features can affect estimates for many visually related states.</div>`}
function miniFrameStack(){return `<div role="img" aria-label="Four consecutive Breakout frames stacked from t minus 3 through current time t; their changes reveal motion"><div class="mini-frame-stack">${scripted.frames.map((frame,i)=>`<span class="mini-state-frame" style="--mini-ball-x:${24+i*8}%;--mini-ball-y:${62-i*8}%;--mini-paddle-x:${frame.p}%"><i></i><b></b><small>${i===3?'t':`t−${3-i}`}</small></span>`).join('')}</div><span class="stack-caption">4 frames · changes reveal motion</span></div>`}
function scaleDqn(){const game=board(scripted.frames[3],'Breakout gameplay generating a stream of changing states').replace('class="breakout"','class="breakout race-game"').replace('role="img"','id="raceBoard" role="img"');return `<div class="representation-race"><div class="race-main"><div class="race-board"><div class="race-board-head"><div class="label">Gameplay generates a new visual configuration each moment</div><button type="button" class="race-pause" id="racePauseBtn" aria-pressed="false">Pause</button></div>${game}<div class="race-inspect-status" id="raceInspectStatus">Playing live · select any Q-table row to inspect its exact frame.</div><div class="race-counters"><div class="race-counter"><span>Frames observed</span><b id="raceFrames">1</b></div><div class="race-counter growing"><span>Distinct exact states</span><b id="raceStates">1</b></div><div class="race-counter growing"><span>Tabular Q-values required</span><b id="raceValues">3</b></div><div class="race-counter shared"><span>DQN reused</span><b>1 network</b></div></div></div><div><div class="race-compare"><section class="race-lane"><h3>Exact-state Q-table</h3><p>Select a row to pause and restore its frame</p><div class="row-stream" id="raceRows"><div class="stream-row stream-head"><b>State</b><b>L</b><b>S</b><b>R</b></div></div></section><section class="race-lane"><h3>Deep Q-Network</h3><p>The same parameters process every state</p><div class="shared-network">${miniFrameStack()}<span class="shared-arrow">→</span><span class="shared-layer">DQN<br>CNN + action head</span></div><div class="reuse-message" id="reuseMessage">State 1 uses the same network</div></section></div><div class="representation-tabs" role="group" aria-label="Compare state representations"><button type="button" class="representation-tab" data-representation="raw" aria-pressed="true">Raw pixels</button><button type="button" class="representation-tab" data-representation="factors" aria-pressed="false">Game factors</button><button type="button" class="representation-tab" data-representation="table" aria-pressed="false">Q-table</button><button type="button" class="representation-tab" data-representation="dqn" aria-pressed="false">DQN features</button></div><div class="representation-detail" id="representationDetail">${representationDetail('raw')}</div></div></div><div class="note">A Q-table needs a new row for every exact game state. One DQN processes every four-frame state and estimates the values of Left, Stay, and Right.</div></div>`}
function map(seed){return `<div class="map">${Array.from({length:36},(_,i)=>`<i class="${(i+seed)%11<2?'hot':(i+seed)%17===0?'blue':''}"></i>`).join('')}</div>`}
function cnn(){return `<div class="cnn-teaching" id="cnnTeaching"><div class="cnn-layout"><div><div class="label">4 input channels · processed together</div><div class="mini-stack">${scripted.frames.map((f,i)=>board(f,`Input frame ${i+1} of 4`)).join('')}<span class="receptive-scan" aria-hidden="true"></span></div></div><div class="flow-arrow">→</div><div class="cnn-pipeline"><div class="cnn-stage stage-1"><div class="map-stack">${map(1)}${map(5)}${map(9)}</div><div class="stage-label">Layer 1 · local edges</div></div><div class="cnn-stage stage-2"><div class="map-stack">${map(3)}${map(7)}${map(12)}</div><div class="stage-label">Layer 2 · parts</div></div><div class="cnn-stage stage-3"><div class="map-stack">${map(4)}${map(10)}${map(15)}</div><div class="stage-label">Layer 3 · relationships</div></div></div><div class="cnn-output-association"><div class="label">DQN action-value estimates</div><div class="cnn-q-row" role="table" aria-label="Illustrative DQN output for the current four-frame state"><div class="cnn-q-head" role="row"><span role="columnheader">State</span><span role="columnheader">Left</span><span role="columnheader">Stay</span><span role="columnheader">Right</span></div><div class="cnn-q-values" role="row"><span role="cell">4 frames</span><span role="cell">${scripted.q.left.toFixed(2)}</span><span role="cell">${scripted.q.stay.toFixed(2)}</span><span class="selected" role="cell">${scripted.q.right.toFixed(2)}</span></div></div><small>One network output—not a stored Q-table row</small></div></div><div class="evidence" aria-label="Evidence ordered by the CNN layer where it emerges"><span data-layer="Layer 2"><i class="evidence-icon icon-ball" aria-hidden="true"></i>Ball position</span><span data-layer="Layer 2"><i class="evidence-icon icon-paddle" aria-hidden="true"></i>Paddle position</span><span data-layer="Layer 2"><i class="evidence-icon icon-bricks" aria-hidden="true"></i>Remaining bricks</span><span data-layer="Layer 3"><i class="evidence-icon icon-motion" aria-hidden="true"></i>Motion direction</span><span data-layer="Layer 3"><i class="evidence-icon icon-collision" aria-hidden="true"></i>Collision geometry</span></div><div class="cnn-footer"><div class="cnn-status" id="cnnStatus" aria-live="polite">Preparing the four-frame input.</div><button type="button" class="cnn-replay" id="cnnReplayBtn">Replay animation</button></div></div>`}
function networkSVG(back=false){const inputs=[80,135,190,245,300],hidden=[100,160,220,280],outs=[120,190,260],reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let lines='',photons='';const photon=(x1,y1,x2,y2,delay)=>`<circle class="training-photon" r="4" cx="${x2}" cy="${y2}"><animate attributeName="cx" from="${x2}" to="${x1}" dur="${reduced?'.01':'0.85'}s" begin="${reduced?'0':delay}s" repeatCount="${reduced?'1':'2'}" fill="freeze"/><animate attributeName="cy" from="${y2}" to="${y1}" dur="${reduced?'.01':'0.85'}s" begin="${reduced?'0':delay}s" repeatCount="${reduced?'1':'2'}" fill="freeze"/></circle>`;inputs.forEach((y,i)=>hidden.forEach((hy,j)=>{lines+=`<line class="net-link ${back?'backprop':''} ${(i+j)%5===0?'neg':''}" x1="115" y1="${y}" x2="390" y2="${hy}" stroke-width="${1+((i+j)%4)}" style="animation-delay:${(i*4+j)*.025}s"/>`;if(back&&(i+j)%3===0)photons+=photon(115,y,390,hy,.75+(i+j)*.08)}));hidden.forEach((y,j)=>outs.forEach((oy,k)=>{lines+=`<line class="net-link ${back?'backprop':''}" x1="390" y1="${y}" x2="665" y2="${oy}" stroke-width="${1+((j+k)%4)}" style="animation-delay:${.4+(j*3+k)*.04}s"/>`;if(back&&(j+k)%2===0)photons+=photon(390,y,665,oy,.12+(j+k)*.08)}));const node=(x,y,t,cls='')=>`<g class="net-node ${cls}" transform="translate(${x} ${y})"><circle r="25"/><text y="4">${t}</text></g>`;return `<svg class="network" viewBox="0 0 780 350" role="img" aria-label="${back?'Red training photons carry the temporal-difference correction backward from the selected Q-value through the dense and CNN layers':'CNN evidence passes through dense hidden units to three action-value outputs'}"><text class="layer-label" x="115" y="24">CNN evidence</text><text class="layer-label" x="390" y="24">Dense layer</text><text class="layer-label" x="665" y="24">Q-value outputs</text>${lines}${photons}${inputs.map((y,i)=>node(115,y,['Ball','Motion','Paddle','Bricks','Collision'][i])).join('')}${hidden.map((y,i)=>node(390,y,`H${i+1}`,'hidden')).join('')}${outs.map((y,i)=>node(665,y,[`L ${scripted.q.left.toFixed(2)}`,`S ${scripted.q.stay.toFixed(2)}`,`R ${scripted.q.right.toFixed(2)}`][i],'output')).join('')}</svg>`}
function network(){return `<div class="network-layout">${networkSVG()}<div class="note info">Green paths raise a downstream signal; red paths lower it; thicker paths have larger magnitude. These are <b>illustrative values</b>.</div></div>`}
function transitionFrameStack(frames,label){return `<div class="transition-frame-stack" role="img" aria-label="${label}: four consecutive Breakout frames processed as one state">${frames.map((frame,i)=>board(frame,`${label}, frame ${i+1} of 4`)).join('')}</div><span class="transition-stack-label">${label}<small>4-frame state</small></span>`}
function replay(){const nextFrames=[scripted.frames[1],scripted.frames[2],scripted.frames[3],{x:56,y:48,p:57}];const transition=`<div class="transition-flow"><div class="transition-item state">${transitionFrameStack(scripted.frames,'Current state')}</div><div class="transition-arrow">→</div><div class="transition-item chosen-action"><span>DQN estimates <em>illustrative</em></span><div class="action-q-values"><small>L ${scripted.q.left.toFixed(2)}</small><small>S ${scripted.q.stay.toFixed(2)}</small><small class="selected">R ${scripted.q.right.toFixed(2)}</small></div><span>Selected action</span><b>${scripted.transition.action}</b></div><div class="transition-arrow">→</div><div class="transition-item"><span>Reward</span><b>+${scripted.transition.reward}</b></div><div class="transition-arrow">→</div><div class="transition-item state">${transitionFrameStack(nextFrames,'Next state')}</div><div class="transition-arrow">→</div><div class="transition-item"><span>Terminal?</span><b>No</b></div></div>`;return `<div>${transition}<div class="scene-action"><button class="primary" id="storeBtn">Store and sample →</button></div><div id="replayStage" hidden style="margin-top:15px"><div class="replay-layout"><div class="panel"><h3>Replay memory</h3><div class="memory"><div class="experience header"><span>State</span><span>Action</span><span>Reward</span><span>Next</span><span>Done</span></div>${scripted.replay.map((r,i)=>`<div class="experience ${[0,2,4,5].includes(i)?'sampled':''}">${r.map(x=>`<span>${x}</span>`).join('')}</div>`).join('')}</div></div><div class="flow-arrow replay-sample-arrow"><small>Copy selected rows</small>→</div><div class="panel"><h3>Sampled batch for learning</h3><div class="batch"><div class="batch-experience"><b>Experience 1</b><div class="experience"><span>s₁</span><span>Left</span><span>0</span><span>s₂</span><span>false</span></div></div><div class="batch-experience"><b>Experience 3</b><div class="experience"><span>s₃</span><span>Right</span><span>+1</ function bellman(){return `<section class="qtable-association" aria-labelledby="qtableAssociationTitle"><div class="label">Same learning rule as the Q-Table Explorer</div><h3 id="qtableAssociationTitle">The Bellman equation supplies the learning target</h3><p>Current usefulness should reflect the reward now plus the discounted best usefulness available next.</p><div class="association-formulas"><div><b>Bellman learning target</b><code><span class="eq-target">target</span> = <span class="eq-reward">reward</span> + <span class="formula-gamma eq-gamma">γ</span> × <span class="eq-future">best next Q</span></code></div><div><b>Familiar Q-table update</b><code>new Q = old Q + <span class="formula-alpha eq-alpha">α</span> × (<span class="eq-reward">reward</span> + <span class="formula-gamma eq-gamma">γ</span> × <span class="eq-future">best next Q</span> − old Q)</code></div></div><div class="association-handoff"><span>Q-table: change one stored cell</span><i>→</i><span>DQN: change network weights with backpropagation</span></div></section><div class="bellman-layout"><div class="calc-steps"><div class="calc-step"><b>1. Observe reward</b><br>r = <span class="eq-reward">${scripted.transition.reward.toFixed(2)}</span></div><div class="calc-step"><b>2. Ask the target network</b><br>max Q<sub>target</sub>(next state, a) = <span class="eq-future">${scripted.nextMax.toFixed(2)}</span></div><div class="calc-step"><b>3. Discount future value</b><br><span class="eq-gamma">γ = ${scripted.gamma.toFixed(2)}</span></div><div class="formula"><span class="eq-target">target</span> = <span class="eq-reward">1.00</span> + <span class="eq-gamma">0.90</span> × <span class="eq-future">1.40</span><br>= <span class="eq-target">${scripted.target.toFixed(2)}</span></div></div><div class="flow-arrow back">⇄</div><div class="panel"><h3>Prediction versus target</h3><div class="comparison"><div class="compare-value">Online Q(s, Right)<b class="eq-prediction">${scripted.prediction.toFixed(2)}</b></div><div class="compare-value target-value">Bellman target<b class="eq-target">${scripted.target.toFixed(2)}</b><small><span class="eq-reward">+${scripted.transition.reward.toFixed(2)} reward</span> + (<span class="eq-gamma">${scripted.gamma.toFixed(2)}</span> × <span class="eq-future">${scripted.nextMax.toFixed(2)}</span> highest next-state estimate)</small></div><div class="error-box">TD error = <span class="eq-target">${scripted.target.toFixed(2)}</span> − <span class="eq-prediction">${scripted.prediction.toFixed(2)}</span> = <span class="eq-error">${scripted.td.toFixed(2)}</span></div></div><div class="photon-legend"><i></i>Red photons carry the correction backward during training</div>${networkSVG(true)}</div></div><div class="learning-controls"><div><b>Discount factor · <span class="eq-gamma">γ = 0.90</span></b><span>Controls how much estimated future reward enters the learning goal.</span></div><div><b>Learning rate · <span class="eq-alpha">α = 0.001</span></b><span>Controls how far backpropagation moves the DQN weights during this update.</span></div></div><div class="note"><span class="illustrative">Illustrative values</span> If the transition were terminal, the target would be reward only; there is no next-state value to add.</div>`}
function target(){return `<div class="target-comparison"><div class="target-layout"><section class="model-card online"><span class="label">Actively learning</span><h3>Online network</h3><p>Produces the current prediction and changes after every sampled learning update.</p><div class="role-flow"><span>Current or sampled state</span><i>→</i><b>Q(s, action)</b></div><ul class="role-list"><li>Selects actions during gameplay</li><li>Receives learning corrections through backpropagation</li><li>Weights θ change frequently</li></ul><div class="weight-row" aria-label="Illustrative online weights"><i></i><i></i><i></i><i></i></div><strong>Online weights · θ</strong></section><div class="sync-bridge"><div class="sync-arrow ${state.targetSynced?'copying':''}">→</div><b>Periodic copy</b><small>θ → θ⁻</small></div><section class="model-card target"><span class="label">Temporarily frozen</span><h3>Target network</h3><p>Supplies a stable next-state estimate while the online network changes.</p><div class="role-flow"><span>Next four-frame state</span><i>→</i><b>best next Q</b></div><ul class="role-list"><li>Does not select the current action</li><li>Does not receive backpropagation</li><li>Weights θ⁻ stay fixed between copies</li></ul><div class="weight-row" aria-label="Illustrative target weights"><i></i><i></i><i></i><i></i></div><strong>Target weights · θ⁻</strong><div class="target-source">Supplies Scene 7’s next-state estimate: <b>1.40</b></div></section></div><div class="target-interaction" aria-label="How the two networks interact"><span><b>1</b> Online network learns</span><i>→</i><span><b>2</b> Target stays fixed</span><i>→</i><span><b>3</b> Copy online weights periodically</span></div><div class="scene-action"><button class="primary" id="syncBtn">Copy online weights → target</button></div><div class="note info" id="syncStatus">The stable target keeps the learning goal from changing during every online-network update.</div></div>`}
function act(){const explore=state.phase===1,chosen=explore?'stay':'right',draw=explore?.06:.64,comparison=explore?'&lt;':'&gt;';return `<div class="epsilon-scene ${explore?'explore-example':'exploit-example'}"><div class="act-bridge"><b>Same ε-greedy rule as the Q-Table Explorer</b><span>The DQN supplies the three action-value estimates.</span></div><div class="epsilon-path"><section class="epsilon-state"><div class="label">Current input</div>${transitionFrameStack(scripted.frames,'Current state')}</section><i class="epsilon-arrow">→</i><section class="policy-values"><div class="label">DQN estimates · illustrative</div><div class="q-outputs"><div class="q-output ${chosen==='left'?'chosen':''}"><span>Left</span><b>${scripted.q.left.toFixed(2)}</b></div><div class="q-output ${chosen==='stay'?'chosen':''}"><span>Stay</span><b>${scripted.q.stay.toFixed(2)}</b></div><div class="q-output max ${chosen==='right'?'chosen':''}"><span>Right</span><b>${scripted.q.right.toFixed(2)}</b><small>largest</small></div></div></section><i class="epsilon-arrow">→</i><section class="epsilon-gate" style="--draw:${draw*100}%"><div class="label">ε-greedy check</div><div class="draw-equation"><span>Scripted draw</span><b>${draw.toFixed(2)}</b><i>${comparison}</i><span>ε</span><b>${scripted.epsilon.toFixed(2)}</b></div><div class="epsilon-scale" aria-label="Explore from zero to 0.10; exploit above 0.10"><span class="explore-zone">Explore · 10%</span><span class="exploit-zone">Exploit · 90%</span><i class="draw-marker" aria-hidden="true"></i></div><div class="epsilon-result"><b>${explore?'Explore':'Exploit'}</b><span>${explore?'Deliberately try a non-maximal action':'Use the largest estimated action value'}</span><strong>Choose ${explore?'Stay':'Right'}</strong></div></section></div><div class="scene-action"><button id="decisionBtn">Show ${explore?'exploitation':'exploration'} example</button></div><div class="act-objective"><b>${explore?'Some decisions explore':'Most decisions exploit'}</b><s function loop(){const info=[['Observe','Four consecutive frames form the current state.'],['Estimate','The DQN produces Left, Stay, and Right values.'],['Act','The ε-greedy policy carries forward Scene 8’s choice: Right.'],['Environment','The paddle moves, a brick is hit, and reward +1 is observed.'],['Record','The current state, Right, +1, next state, and terminal flag become one transition.'],['Replay','The transition joins stored gameplay experiences and may be sampled later.'],['Learn','The sampled batch produces learning targets, mismatches, and red correction photons that update the online DQN.'],['Repeat','The updated online DQN estimates values for the next decision.']];const cls=(i,type='')=>`cycle-node ${type} ${state.phase===i?'active':''} ${state.phase>i?'complete':''}`;const edge=i=>`<i class="cycle-edge ${state.phase>i?'complete':''}">${i<3?'→':i===3?'↓':'←'}</i>`;return `<div class="closed-cycle"><div class="cycle-bridge"><b>Continue Scene 8’s exploitation example</b><span>Right was selected from the current DQN estimates.</span></div><div class="cycle-map"><section class="${cls(0)} cycle-frames"><span class="step-number">1</span><b>Four-frame state</b>${miniFrameStack()}</section>${edge(0)}<section class="${cls(1)} cycle-values"><span class="step-number">2</span><b>DQN estimates</b><div class="cycle-q"><span>L .82</span><span>S .31</span><span class="selected">R 1.24</span></div></section>${edge(1)}<section class="${cls(2)} cycle-action"><span class="step-number">3</span><b>Action</b><strong>Right</strong><small>ε-greedy exploit</small></section>${edge(2)}<section class="${cls(3)} cycle-environment"><span class="step-number">4</span><b>Environment responds</b><div class="cycle-outcome"><span>Next 4 frames</span><strong>Reward +1</strong><small>brick hit</small></div></section>${edge(3)}<section class="${cls(4,'learning')} cycle-transition"><span class="step-number">5</span><b>Transition</b><div class="cycle-transition-row"><span>state</span><span>Right</span><span>+1</span><span>next</span><span>false</span></div></section>${edge(4)}<section class="${cls(5,'learning')} cycle-replay"><span class="step-number">6</span><b>Replay memory</b><div class="cycle-memory"><i></i><i></i><i class="sampled"></i><i></i></div><small>store now · sample later</small></section>${edge(5)}<section class="${cls(6,'learning')} cycle-learn"><span class="step-number">7</span><b>Update online DQN</b><div class="cycle-math"><span>target 2.26</span><span>error 1.02</span></div><div class="cycle-photons" aria-label="Red correction photons travel backward through the online DQN"><i></i><i></i><i></i><i></i></div></section>${edge(6)}<section class="${cls(7)} cycle-repeat"><span class="step-number">8</span><b>Next decision</b><strong>Updated DQN</strong><small>estimate again</small></section><i class="cycle-return ${state.phase>=7?'complete':''}">↑ updated weights return to acting</i></div><div class="cycle-readout" aria-live="polite"><b>${state.phase+1} · ${info[state.phase][0]}</b><span>${info[state.phase][1]}</span></div><div class="scene-action"><button class="primary" id="loopBtn">${state.phase>=7?'Replay complete loop':'Advance one stage →'}</button></div><div class="cycle-legend"><span><i class="forward"></i>Acting creates experience</span><span><i class="backward"></i>Learning improves later acting</span></div></div>`}

function startBreakoutDemo(){const board=$('#demoBoard');if(!board)return;bindEnvironmentTerms();if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const ball=board.querySelector('.ball'),trail=board.querySelector('.trail'),paddle=board.querySelector('.paddle'),bricks=[...board.querySelectorAll('.brick')];let x=board.clientWidth*.46,y=board.clientHeight*.63,dx=118,dy=-142,p=board.clientWidth*.42,last=performance.now(),remaining=bricks.filter(b=>!b.classList.contains('gone')).length,rewardUntil=0,serve=1;function resetBall(){x=board.clientWidth*.48;y=board.clientHeight*.62;serve*=-1;dx=serve*112;dy=-145;p=board.clientWidth*.46}function frame(now){if(!document.body.contains(board))return;const dt=Math.min(.025,(now-last)/1000||0);last=now;const w=board.clientWidth,h=board.clientHeight,paddleY=h-27,paddleHalf=27,target=x,oldP=p;p+=Math.max(-175*dt,Math.min(175*dt,target-p));p=Math.max(paddleHalf,Math.min(w-paddleHalf,p));x+=dx*dt;y+=dy*dt;const r=6;if(x<r){x=r;dx=Math.abs(dx)}if(x>w-r){x=w-r;dx=-Math.abs(dx)}if(y<r){y=r;dy=Math.abs(dy)}if(dy>0&&y+r>=paddleY&&y-r<=paddleY+9&&x>=p-paddleHalf-2&&x<=p+paddleHalf+2){y=paddleY-r;dy=-Math.abs(dy)*1.01;dx+=((x-p)/paddleHalf)*52;dx=Math.max(-190,Math.min(190,dx))}const boardRect=board.getBoundingClientRect();for(const brick of bricks){if(brick.classList.contains('gone'))continue;const rect=brick.getBoundingClientRect(),left=rect.left-boardRect.left,right=rect.right-boardRect.left,top=rect.top-boardRect.top,bottom=rect.bottom-boardRect.top;if(x+r>left&&x-r<right&&y+r>top&&y-r<bottom){brick.classList.add('gone');remaining--;dy*=-1;rewardUntil=now+650;$('#demoReward').textContent='+1';$('#demoBricks').textContent=remaining;break}}if(y>h+r){$('#demoReward').textContent='−1';rewardUntil=now+850;resetBall()}if(remaining<=0){bricks.forEach((brick,i)=>brick.classList.toggle('gone',[2,11].includes(i)));remaining=bricks.length-2;$('#demoBricks').textContent=remaining;resetBall()}if(now>rewardUntil)$('#demoReward').textContent='0';const action=p-oldP>1?'Right':p-oldP<-1?'Left':'Stay';$('#demoAction').textContent=action;ball.style.left=`${x}px`;ball.style.top=`${y}px`;trail.style.left=`${x-dx*.055}px`;trail.style.top=`${y-dy*.055}px`;paddle.style.left=`${p}px`;state.raf=requestAnimationFrame(frame)}state.raf=requestAnimationFrame(frame)}
function updateRawFrames(){if(state.raceMode!=='raw')return;const history=state.raceHistory.length?state.raceHistory:Array(4).fill({x:40,y:40,p:40,gone:[]}),board=$('#raceBoard'),w=board?.clientWidth||100,h=board?.clientHeight||100;$$('[data-raw-frame]').forEach((frame,index)=>{const sample=history[Math.max(0,history.length-4+index)]||history[history.length-1],cells=[...frame.children],ballCol=Math.max(0,Math.min(7,Math.floor(sample.x/w*8))),ballRow=Math.max(1,Math.min(6,Math.floor(sample.y/h*8))),paddleCol=Math.max(1,Math.min(6,Math.floor(sample.p/w*8)));cells.forEach((cell,i)=>{const row=Math.floor(i/8),col=i%8;cell.className='';if(row<2&&!sample.gone.includes(row*8+col))cell.classList.add('raw-brick');if(row===ballRow&&col===ballCol)cell.classList.add('raw-ball');else if(row===Math.min(6,ballRow+1)&&col===Math.max(0,ballCol-1))cell.classList.add('raw-trail');if(row===7&&Math.abs(col-paddleCol)<=1)cell.classList.add('raw-paddle')})})}
function updateMiniFrameStack(){const board=$('#raceBoard'),history=state.raceHistory;if(!board||!history.length)return;$$('.mini-state-frame').forEach((frame,index)=>{const sample=history[Math.max(0,history.length-4+index)]||history[history.length-1];frame.style.setProperty('--mini-ball-x',`${Math.max(4,Math.min(92,sample.x/board.clientWidth*100))}%`);frame.style.setProperty('--mini-ball-y',`${Math.max(18,Math.min(82,sample.y/board.clientHeight*100))}%`);frame.style.setProperty('--mini-paddle-x',`${Math.max(14,Math.min(86,sample.p/board.clientWidth*100))}%`)})}
function startRawFrameSync(){const capture=()=>{const board=$('#raceBoard');if(!board||state.racePaused)return;const ball=board.querySelector('.ball'),paddle=board.querySelector('.paddle'),bricks=[...board.querySelectorAll('.brick')];state.raceHistory.push({x:ball.offsetLeft,y:ball.offsetTop,p:paddle.offsetLeft,gone:bricks.map((brick,i)=>brick.classList.contains('gone')?i:null).filter(i=>i!==null)});while(state.raceHistory.length>4)state.raceHistory.shift();updateRawFrames();updateMiniFrameStack()};state.raceHistory=[];capture();const timer=setInterval(capture,140);state.timers.add(timer)}

function startRepresentationRace(){const board=$('#raceBoard');if(!board)return;bindRepresentationTabs();state.raceFrames=1;state.raceStates=1;state.raceMode='raw';state.racePaused=false;state.raceSamples=[];const ball=board.querySelector('.ball'),trail=board.querySelector('.trail'),paddle=board.querySelector('.paddle'),bricks=[...board.querySelectorAll('.brick')],pause=$('#racePauseBtn'),rows=$('#raceRows');let x=board.clientWidth*.46,y=board.clientHeight*.64,dx=122,dy=-148,p=board.clientWidth*.42,last=performance.now(),lastSample=last,serve=1;function reset(){x=board.clientWidth*.48;y=board.clientHeight*.64;serve*=-1;dx=serve*118;dy=-148}function snapshot(id){return{id,x,y,p,dx,dy,gone:bricks.map((brick,i)=>brick.classList.contains('gone')?i:null).filter(i=>i!==null)}}function paint(sample){ball.style.left=`${sample.x}px`;ball.style.top=`${sample.y}px`;trail.style.left=`${sample.x-sample.dx*.055}px`;trail.style.top=`${sample.y-sample.dy*.055}px`;paddle.style.left=`${sample.p}px`;bricks.forEach((brick,i)=>brick.classList.toggle('gone',sample.gone.includes(i)))}function inspect(id){const sample=state.raceSamples.find(item=>item.id===id);if(!sample)return;state.racePaused=true;pause.textContent='Resume';pause.setAttribute('aria-pressed','true');paint(sample);$$('#raceRows [data-race-state]').forEach(row=>row.classList.toggle('selected',+row.dataset.raceState===id));$('#raceInspectStatus').textContent=`Paused at S${id} · this exact board image generated that Q-table row.`;$('#liveStatus').textContent=`Paused to inspect exact state S${id}.`}function addRow(sample){rows.insertAdjacentHTML('beforeend',`<button type="button" class="stream-row new" data-race-state="${sample.id}" aria-label="Inspect exact state S${sample.id}"><span>S${sample.id}</span><span>?</span><span>?</span><span>?</span></button>`);rows.lastElementChild.onclick=()=>inspect(sample.id);while(rows.children.length>6)rows.children[1].remove()}function addState(){state.raceFrames++;state.raceStates++;const sample=snapshot(state.raceStates);state.raceSamples.push(sample);$('#raceFrames').textContent=state.raceFrames.toLocaleString();$('#raceStates').textContent=state.raceStates.toLocaleString();$('#raceValues').textContent=(state.raceStates*3).toLocaleString();$('#reuseMessage').textContent=`State ${state.raceStates.toLocaleString()} uses the same network`;addRow(sample);if(state.raceMode==='table')$('#representationDetail').innerHTML=representationDetail('table')}pause.onclick=()=>{state.racePaused=!state.racePaused;pause.textContent=state.racePaused?'Resume':'Pause';pause.setAttribute('aria-pressed',String(state.racePaused));if(!state.racePaused){$$('#raceRows [data-race-state]').forEach(row=>row.classList.remove('selected'));$('#raceInspectStatus').textContent='Playing live · select any Q-table row to inspect its exact frame.';last=performance.now();lastSample=last}else $('#raceInspectStatus').textContent='Paused at the current live frame.'};function frame(now){if(!document.body.contains(board))return;if(state.racePaused){last=now;state.raf=requestAnimationFrame(frame);return}const dt=Math.min(.025,(now-last)/1000||0);last=now;const w=board.clientWidth,h=board.clientHeight,r=6,paddleY=h-27,paddleHalf=27;p+=Math.max(-178*dt,Math.min(178*dt,x-p));p=Math.max(paddleHalf,Math.min(w-paddleHalf,p));x+=dx*dt;y+=dy*dt;if(x<r){x=r;dx=Math.abs(dx)}if(x>w-r){x=w-r;dx=-Math.abs(dx)}if(y<r){y=r;dy=Math.abs(dy)}if(dy>0&&y+r>=paddleY&&x>=p-paddleHalf&&x<=p+paddleHalf){y=paddleY-r;dy=-Math.abs(dy);dx=Math.max(-185,Math.min(185,dx+((x-p)/paddleHalf)*48))}const boardRect=board.getBoundingClientRect();for(const brick of bricks){if(brick.classList.contains('gone'))continue;const rect=brick.getBoundingClientRect(),left=rect.left-boardRect.left,right=rect.right-boardRect.left,top=rect.top-boardRect.top,bottom=rect.bottom-boardRect.top;if(x+r>left&&x-r<right&&y+r>top&&y-r<bottom){brick.classList.add('gone');dy=Math.abs(dy);break}}if(y>h+r)reset();if(now-lastSample>520){lastSample=now;addState()}paint({x,y,p,dx,dy,gone:bricks.map((brick,i)=>brick.classList.contains('gone')?i:null).filter(i=>i!==null)});state.raf=requestAnimationFrame(frame)}const first=snapshot(1);state.raceSamples.push(first);addRow(first);if(!matchMedia('(prefers-reduced-motion: reduce)').matches)state.raf=requestAnimationFrame(frame)}
function bindScene(scene){if(scene.kind==='environment')startBreakoutDemo();if(scene.kind==='cnn')startCnnTeaching();if(scene.kind==='scaleDqn')startRepresentationRace();if(scene.kind==='replay')$('#storeBtn').onclick=()=>{$('#storeBtn').disabled=true;$('#replayStage').hidden=false;$('#liveStatus').textContent='Transition stored. Four deterministic replay experiences were sampled.'};if(scene.kind==='target')$('#syncBtn').onclick=()=>{state.targetSynced=true;$('.sync-arrow').classList.add('copying');$('#syncBtn').disabled=true;$('#syncStatus').textContent='Target synchronized: θ⁻ now matches the current online weights θ.';$('#liveStatus').textContent='Online weights copied to the target network.'};if(scene.kind==='act')$('#decisionBtn').onclick=()=>{state.phase=state.phase===1?0:1;renderScene(state.scene,false,true)};if(scene.kind==='loop')$('#loopBtn').onclick=()=>{state.phase=state.phase>=7?0:state.phase+1;renderScene(state.scene,false,true)}}
function renderScene(index,announce=true,preserveLocal=false){clearTimers();state.epoch++;const nextScene=Math.max(0,Math.min(scenes.length-1,index));if(!preserveLocal||nextScene!==state.scene){state.phase=0;state.targetSynced=false}state.scene=nextScene;const scene=scenes[state.scene];$('#sceneKicker').textContent=scene.kicker;$('#sceneTitle').textContent=scene.title;$('#sceneCopy').textContent=scene.copy;$('#sceneCount').textContent=`Scene ${state.scene+1} of ${scenes.length}`;const content=$('#sceneContent');content.classList.remove('scene-content');void content.offsetWidth;content.innerHTML=renderContent(scene);content.classList.add('scene-content');$$('.chapter').forEach(x=>x.classList.toggle('active',+x.dataset.chapter===scene.chapter));$('#prevBtn').disabled=state.scene===0;$('#nextBtn').disabled=state.scene===scenes.length-1;$('#nextBtn').textContent=state.scene===scenes.length-1?'Lesson complete':'Next →';$('#progressFill').style.width=`${(state.scene+1)/scenes.length*100}%`;$('.progress').setAttribute('aria-valuemax',scenes.length);$('.progress').setAttribute('aria-valuenow',state.scene+1);bindScene(scene);if(announce)$('#liveStatus').textContent=`Scene ${state.scene+1}: ${scene.title}. ${scene.copy}`}
