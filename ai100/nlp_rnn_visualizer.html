function renderOnehot(){const corpus=[['dog','runs'],['hound','runs'],['cat','runs'],['car','runs'],['student','learns'],['teacher','learns']],v=onehotVector('dog');return `<div class="vocab-build"><div class="corpus-panel"><h3>1. Sample text used to set up this tiny vocabulary</h3><p class="build-copy">Real tokenizers train on far more text. This small example keeps every step visible.</p><div class="corpus-lines">${corpus.map(line=>`<div class="corpus-line">${line.map(w=>`<span class="corpus-word" data-corpus-word="${w}">${w}</span>`).join(' ')}</div>`).join('')}</div></div><div class="build-arrow">→</div><div class="vocab-panel"><h3>2. Keep each different token once and assign an ID</h3><p class="build-copy">IDs follow first appearance here. After the build, select any token to encode it.</p><div class="vocab-rows">${vocab.map((w,i)=>`<button type="button" class="vocab-row" data-vocab-step="${i}" data-vocab-word="${w}" disabled><span class="vocab-id">${i+1}</span><span class="vocab-word">${w}</span></button>`).join('')}</div></div><div class="build-controls"><button type="button" id="buildVocabulary">Build vocabulary and IDs</button><span class="build-status" id="buildStatus">Start with the sample text.</span></div><div class="encode-panel" id="encodePanel"><div class="encode-label"><strong id="encodeTitle">3. One-hot encode “dog”</strong><span id="encodeCopy">ID 1 activates position 1. Every other position is 0.</span></div><div class="encode-vector">${v.map((n,i)=>`<span class="encode-cell ${n?'hot':''}" data-encode-id="${i+1}"><small>ID ${i+1}</small><br><b>${n}</b></span>`).join('')}</div></div><div class="build-result" id="buildResult">The vocabulary setup created the IDs; one-hot encoding only activates the selected ID&rsquo;s position. Select other tokens above: the vector length and assigned IDs stay fixed while the 1 moves.</div></div><div class="note">This classroom vocabulary has 8 positions because it contains 8 different tokens. Within this fixed vocabulary, the same token always receives the same ID.</div>`}
function renderLookup(){const selected=state.lookupWord||'student',id=vocab.indexOf(selected),onehot=onehotVector(selected);return `<div class="lookup-layout revealed" id="lookupLayout"><div class="lookup-picker" aria-label="Select a token to trace through the lookup">${vocab.map(w=>`<button type="button" class="${w===selected?'active':''}" data-lookup-word="${w}">${w}</button>`).join('')}</div><div class="pipeline-steps"><div class="pipeline-step"><strong>Token identity</strong><div class="lookup-token">${selected}</div><p>The tokenizer consistently assigns this token ID ${id+1}.</p></div><div class="pipeline-arrow">→</div><div class="pipeline-step"><strong>One-hot address</strong><div class="lookup-onehot">${onehot.map(n=>`<i class="${n?'hot':''}"></i>`).join('')}</div><p>The 1 points to position ${id+1}.</p></div><div class="pipeline-arrow">→</div><div class="pipeline-step"><strong>Learned lookup table</strong><div class="embedding-table">${vocab.map((w,i)=>`<div class="embedding-row ${i===id?'selected':''}"><span class="selected-row-label">ID ${i+1} · ${w}</span><span class="row-values">${Array.from({length:6},(_,j)=>`<i style="opacity:${.35+((i+j)%5)*.13}"></i>`).join('')}</span></div>`).join('')}</div></div></div><div class="lookup-explanation"><div class="lookup-note"><strong>One-hot encoding is useful here.</strong>Its single 1 provides an exact, reliable address for the token. It is not a failed representation; it performs the lookup step.</div><div class="lookup-note"><strong>The table supplies learned information.</strong>Each row stores a compact number list learned from text examples. The ID selects the row but does not determine its values.</div></div><div class="lookup-result">The highlighted row for <strong>${selected}</strong> is the retrieved <strong>embedding</strong>. The full sequence is: token → stable ID → one-hot address → learned embedding.</div></div>`}
function renderEmbedding(){const anchor=state.embedding||'dog',relatedMap={dog:'hound',hound:'dog',cat:'dog',car:'truck',teacher:'student',student:'teacher'},unrelatedMap={dog:'car',hound:'car',cat:'truck',car:'dog',teacher:'car',student:'truck'},related=relatedMap[anchor]||'hound',unrelated=unrelatedMap[anchor]||'car',words=[anchor,related,unrelated],scores=[related,unrelated].map(w=>Math.max(0,Math.min(1,cosine(vec(anchor),vec(w))))),anchorValues=vec(anchor),strip=(word,role)=>vec(word).slice(0,25).map((n,i)=>{const c=heat(n),delta=Math.abs(n-anchorValues[i]),comparison=role==='related'?(delta<=.38?'match':'minor'):role==='unrelated'?(delta>=.62?'diff':'minor'):'';return `<i class="pattern-cell ${comparison}" style="--cell:${c.v};--strength:${c.s}" title="Coordinate ${i+1}: ${n.toFixed(2)}"></i>`}).join('');return `<div class="embedding-compare" id="embeddingCompare"><div class="compare-picker"><span>Choose a starting token:</span>${['dog','hound','cat','car','teacher','student'].map(w=>`<button type="button" class="${w===anchor?'active':''}" data-embedding="${w}">${w}</button>`).join('')}</div><div class="embedding-lessons"><div class="embedding-lesson"><strong>A fixed-length list</strong>Each token has the same number of learned coordinates. This lesson displays 25 of the 50 values.</div><div class="embedding-lesson"><strong>Read the whole pattern</strong>No single coordinate means “animal” or “student.” Information is distributed across the list.</div><div class="embedding-lesson"><strong>Learned from usage</strong>Tokens used in similar textual situations can develop more alike overall patterns.</div></div><div class="pattern-board">${words.map((w,i)=>`<div class="pattern-row ${i===0?'anchor':''}"><span class="pattern-label">${w}</span><span class="pattern-strip">${strip(w,i===1?'related':i===2?'unrelated':'anchor')}</span></div>`).join('')}</div><div class="pattern-legend"><span class="legend-key"><i class="legend-swatch"></i>close to the starting token</span><span class="legend-key"><i class="legend-swatch diff"></i>larger difference</span><span class="legend-key"><i class="legend-swatch minor"></i>smaller difference, de-emphasized</span></div><div class="compare-actions"><button type="button" id="compareEmbeddings">Compare the complete patterns</button></div><div class="pattern-results"><div class="pattern-result"><div class="result-head"><span>${anchor} ↔ ${related}</span><strong>more alike</strong></div><div class="alike-meter"><i style="--score:${Math.round(scores[0]*100)}%"></i></div><p>These learned patterns are relatively similar across all 50 coordinates.</p></div><div class="pattern-result less"><div class="result-head"><span>${anchor} ↔ ${unrelated}</span><strong>less alike</strong></div><div class="alike-meter"><i style="--score:${Math.round(scores[1]*100)}%"></i></div><p>These learned patterns differ more across the complete coordinate lists.</p></div></div><div class="compare-conclusion">Embeddings can carry learned relationships because we compare the complete number patterns—not vocabulary IDs and not individual coordinates. Next, we will arrange many embeddings so more alike patterns appear nearer one another.</div></div><div class="note">Cell fills use the same value color scale for every embedding. After comparison, outlines show coordinate-level similarities and differences; the bars summarize all 50 values.</div>`}

function animateTrainingPhotons(){const svg=$('.tiny-network svg'),path=$('.tiny-network .network-lines path');if(!svg||!path||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const length=path.getTotalLength();for(let i=0;i<12;i++)setTimeout(()=>{const photon=document.createElementNS('http://www.w3.org/2000/svg','circle');photon.setAttribute('r','5');photon.setAttribute('class','training-photon');svg.appendChild(photon);const start=performance.now(),duration=760;const tick=now=>{const progress=Math.min(1,(now-start)/duration),point=path.getPointAtLength(length*(1-progress));photon.setAttribute('cx',point.x);photon.setAttribute('cy',point.y);if(progress<1)requestAnimationFrame(tick);else photon.remove()};requestAnimationFrame(tick)},i*55)}
function runTrainingSentence(){clearTimeout(trainingTimer);const base=Math.floor(state.trainStep/5)*5,words=$$('.training-words b'),button=$('#trainNext'),status=$('.training-status');button.disabled=true;button.textContent='Training sentence…';words.forEach(w=>w.classList.remove('current','processed'));let word=0;const processWord=()=>{words.forEach(w=>w.classList.remove('current'));if(word<words.length){const current=words[word];current.classList.add('current');if(word)words[word-1].classList.add('processed');status.textContent=`Pass “${current.textContent}” through the same RNN cell.`;flyTrainingWord(current);word++;trainingTimer=setTimeout(processWord,900);return}words.at(-1)?.classList.add('processed');state.trainStep=base+2;render();trainingTimer=setTimeout(()=>{state.trainStep=base+3;render();trainingTimer=setTimeout(()=>{state.trainStep=base+4;render()},850)},850)};processWord()}
function finishTrainingSequence(){const base=Math.floor(state.trainStep/5)*5;state.trainStep=base+2;render();trainingTimer=setTimeout(()=>{state.trainStep=base+3;render();trainingTimer=setTimeout(()=>{state.trainStep=base+4;render()},800)},800)}
function processOneTrainingWord(){const words=$$('.training-words b');if(state.trainWord>=words.length){finishTrainingSequence();return false}words.forEach((word,i)=>{word.classList.toggle('processed',i<state.trainWord);word.classList.toggle('current',i===state.trainWord)});const current=words[state.trainWord],status=$('.training-status');if(status)status.textContent=`Pass “${current.textContent}” through the same RNN cell.`;flyTrainingWord(current);state.trainWord++;if(state.trainWord>=words.length)trainingTimer=setTimeout(finishTrainingSequence,850);return true}
function nextTrainingExample(){clearTimeout(trainingTimer);trainingTimer=null;state.trainStep=((Math.floor(state.trainStep/5)+1)%3)*5;state.trainWord=0;render()}
document.addEventListener('click',e=>{const reset=e.target.closest('#trainReset'),step=e.target.closest('#trainStepWordBtn'),fast=e.target.closest('#trainFastBtn'),complete=e.target.closest('#trainCompleteBtn');if(reset){clearTimeout(trainingTimer);trainingTimer=null;state.trainStep=Math.floor(state.trainStep/5)*5;state.trainWord=0;render()}if(step){if(state.trainStep%5===4){nextTrainingExample();return}clearTimeout(trainingTimer);trainingTimer=null;processOneTrainingWord()}if(fast){clearTimeout(trainingTimer);const advance=()=>{if(processOneTrainingWord()&&state.trainWord<$$('.training-words b').length)trainingTimer=setTimeout(advance,260)};advance()}if(complete){clearTimeout(trainingTimer);trainingTimer=null;state.trainWord=$$('.training-words b').length;state.trainStep=Math.floor(state.trainStep/5)*5+4;render()}});
$('.progress').setAttribute('aria-valuemax',String(scenes.length));
function mapToolbar(){return `<div class="map-transport" role="toolbar" aria-label="Build word map controls"><button type="button" id="mapStepBtn" title="Place the next word" aria-label="Place the next word">▶</button><button type="button" id="mapFinishBtn" title="Fast-forward remaining words" aria-label="Fast-forward remaining words">≫</button><button type="button" id="mapResetBtn" title="Reset map" aria-label="Reset map">↺</button><button type="button" id="mapCompleteBtn" title="Show the completed map" aria-label="Show the completed map">▦</button></div>`}
function bind(){const kind=scenes[state.scene].kind;if(kind==='tokens'){$('#startTokenization').onclick=()=>{clearInterval(tokenizationTimer);const rows=$$('[data-token-step]'),source=$$('[data-source-token]');rows.forEach(x=>x.className='sequence-row pending');source.forEach(x=>x.classList.remove('active'));let step=0;$('#startTokenization').textContent='Tokenizing…';$('#startTokenization').disabled=true;const reveal=()=>{source.forEach(x=>x.classList.toggle('active',Number(x.dataset.sourceToken)===step));const row=rows[step];if(row){row.classList.remove('pending');row.classList.add('revealed')}step++;if(step>=rows.length){clearInterval(tokenizationTimer);tokenizationTimer=null;setTimeout(()=>{source.forEach(x=>x.classList.remove('active'));const button=$('#startTokenization');if(button){button.textContent='Tokenize again';button.disabled=false}},350)}};reveal();tokenizationTimer=setInterval(reveal,450)}}if(kind==='onehot'){$$('[data-onehot]').forEach(b=>b.onclick=()=>{state.onehot=b.dataset.onehot;render()});$$('[data-distance-prediction]').forEach(b=>b.onclick=()=>{const demo=$('#distanceDemo'),status=$('#distancePromptStatus');$$('[data-distance-prediction]').forEach(x=>{x.disabled=true;x.style.opacity=x===b?'1':'.45'});status.textContent=`You predicted “${b.dataset.distancePrediction}.” Now watch the numeric comparison…`;demo.classList.remove('revealed');demo.classList.add('running');setTimeout(()=>{if(!document.body.contains(demo))return;demo.classList.remove('running');demo.classList.add('revealed');status.textContent='For semantic distance, the identity codes tie.'},850)})}if(kind==='embedding')$$('[data-embedding]').forEach(b=>b.onclick=()=>{state.embedding=b.dataset.embedding;render()});if(kind==='semantic')$$('[data-semantic]').forEach(b=>b.onclick=()=>{clearInterval(mapBuildTimer);mapBuildTimer=null;state.semanticWord=b.dataset.semantic;render()});if(kind==='rnn'){$('#rnnBack').onclick=()=>{state.rnnStep=Math.max(0,state.rnnStep-1);render()};$('#rnnNext').onclick=()=>{state.rnnStep=Math.min(4,state.rnnStep+1);render()}}if(kind==='evolve'){$('#exampleSelect').onchange=e=>{state.example=e.target.value;state.evolveStep=0;render()};$('#evolveReset').onclick=()=>{state.evolveStep=0;render()};$('#evolveNext').onclick=()=>{const n=examples[state.example||Object.keys(examples)[0]].length-1;state.evolveStep=state.evolveStep>=n?0:state.evolveStep+1;render()}}}
function selectVocabularyWord(word){const id=vocab.indexOf(word)+1;if(!id)return;$$('[data-vocab-word]').forEach(x=>x.classList.toggle('selected',x.dataset.vocabWord===word));$$('[data-encode-id]').forEach(x=>{const hot=Number(x.dataset.encodeId)===id;x.classList.toggle('hot',hot);x.querySelector('b').textContent=hot?'1':'0'});$('#encodeTitle').textContent=`3. One-hot encode “${word}”`;$('#encodeCopy').textContent=`ID ${id} activates position ${id}. Every other position is 0.`;$('#buildStatus').textContent=`Selected “${word}” → ID ${id}`}
document.addEventListener('click',e=>{const vocabButton=e.target.closest('[data-vocab-word]');if(vocabButton&&!vocabButton.disabled){selectVocabularyWord(vocabButton.dataset.vocabWord);return}if(e.target.id!=='buildVocabulary')return;clearInterval(vocabBuildTimer);const rows=$$('[data-vocab-step]'),words=$$('[data-corpus-word]'),panel=$('#encodePanel'),result=$('#buildResult'),status=$('#buildStatus');rows.forEach(x=>{x.classList.remove('visible','selected');x.disabled=true});words.forEach(x=>x.classList.remove('scan'));panel.classList.remove('visible');result.classList.remove('visible');selectVocabularyWord('dog');e.target.disabled=true;e.target.textContent='Building vocabulary…';let step=0;const reveal=()=>{words.forEach(x=>x.classList.toggle('scan',x.dataset.corpusWord===vocab[step]));if(rows[step])rows[step].classList.add('visible');status.textContent=`Found “${vocab[step]}” → assigned ID ${step+1}`;step++;if(step>=vocab.length){clearInterval(vocabBuildTimer);vocabBuildTimer=null;setTimeout(()=>{words.forEach(x=>x.classList.remove('scan'));rows.forEach(x=>x.disabled=false);panel.classList.add('visible');result.classList.add('visible');selectVocabularyWord('dog');const button=$('#buildVocabulary');if(button){button.disabled=false;button.textContent='Build again'}},450)}};reveal();vocabBuildTimer=setInterval(reveal,500)});
document.addEventListener('click',e=>{const lookupWord=e.target.closest('[data-lookup-word]');if(!lookupWord)return;state.lookupWord=lookupWord.dataset.lookupWord;render()});
document.addEventListener('click',e=>{if(e.target.id!=='compareEmbeddings')return;$('#embeddingCompare').classList.add('revealed');e.target.textContent='Complete patterns compared';e.target.disabled=true});
function syncMapControls(){const words=Object.keys(projected),done=state.mapStep>=words.length,step=$('#mapStepBtn'),play=$('#mapPlayBtn'),finish=$('#mapFinishBtn'),complete=$('#mapCompleteBtn'),progress=$('#mapBuildProgress');state.mapBuilt=done;if(step)step.disabled=done;if(finish)finish.disabled=done;if(complete)complete.disabled=done;if(play){play.disabled=done;play.textContent=mapBuildTimer?'Ⅱ':'▶';play.setAttribute('aria-label',mapBuildTimer?'Pause mapping':'Play mapping')}if(progress)progress.textContent=`${state.mapStep}/${words.length}`}
function placeNextMapWord(instant=false){const words=Object.keys(projected);if(state.mapStep>=words.length)return false;const word=words[state.mapStep],id=WORDS.indexOf(word)+1,values=vec(word),point=$(`[data-semantic="${word}"]`),status=$('#mapBuildStatus'),plot=$('#semanticPlot');plot.classList.add('building');status.innerHTML=`<div class="build-word">Mapping<strong>${word}</strong><span>Token ID ${id}</span></div><div><div class="build-embedding-label">50 learned values for “${word}”</div><div class="build-embedding">${values.map((n,i)=>{const c=heat(n);return `<i style="--cell:${c.v};--strength:${c.s};--i:${i}"></i>`}).join('')}</div></div>`;point.classList.remove('arriving');if(instant)point.classList.add('placed');else{point.classList.add('arriving');setTimeout(()=>{point.classList.remove('arriving');point.classList.add('placed')},500)}state.mapStep++;const placeholder=$('.map-results-placeholder strong');if(placeholder)placeholder.textContent=`${state.mapStep} of ${words.length} placed`;syncMapControls();if(state.mapStep>=words.length){clearInterval(mapBuildTimer);mapBuildTimer=null;plot.classList.remove('building');syncMapControls();setTimeout(render,instant?0:520)}return true}
function resetMapBuild(){clearInterval(mapBuildTimer);mapBuildTimer=null;state.mapStep=0;state.mapBuilt=false;const plot=$('#semanticPlot'),status=$('#mapBuildStatus');if(plot)plot.classList.add('building');$$('#semanticPlot .word-point').forEach(x=>x.classList.remove('placed','arriving'));if(status)status.innerHTML='<div class="build-word">Ready to map<strong>Word → map</strong><span>ID + 50 learned values</span></div><div><div class="build-embedding-label">Use Step, Play, or fast-forward</div><div class="build-embedding"></div></div>';syncMapControls()}
document.addEventListener('click',e=>{const control=e.target.closest('#mapStepBtn,#mapPlayBtn,#mapFinishBtn,#mapResetBtn,#mapCompleteBtn');if(!control)return;if(control.id==='mapStepBtn'){clearInterval(mapBuildTimer);mapBuildTimer=null;placeNextMapWord()}if(control.id==='mapPlayBtn'){if(mapBuildTimer){clearInterval(mapBuildTimer);mapBuildTimer=null;syncMapControls()}else{placeNextMapWord();if(state.mapStep<Object.keys(projected).length)mapBuildTimer=setInterval(()=>placeNextMapWord(),720);syncMapControls()}}if(control.id==='mapFinishBtn'){clearInterval(mapBuildTimer);mapBuildTimer=setInterval(()=>{if(!placeNextMapWord(true)){clearInterval(mapBuildTimer);mapBuildTimer=null;syncMapControls()}},65);syncMapControls()}if(control.id==='mapCompleteBtn'){clearInterval(mapBuildTimer);mapBuildTimer=null;while(placeNextMapWord(true));syncMapControls()}if(control.id==='mapResetBtn')resetMapBuild()});
function render(){const s=scenes[state.scene];$('#sceneKicker').textContent=s.kicker;$('#sceneTitle').textContent=s.title;$('#sceneCopy').textContent=s.copy;$('#sceneCount').textContent=`Scene ${state.scene+1} of ${scenes.length}`;const c=$('#sceneContent');c.classList.remove('scene-content');void c.offsetWidth;c.innerHTML=renderContent();c.classList.add('scene-content');$$('.chapter').forEach((x,i)=>x.classList.toggle('active',i===s.chapter));$('#prevBtn').disabled=state.scene===0;$('#nextBtn').textContent=state.scene===scenes.length-1?'Start over':'Next →';$('.progress').setAttribute('aria-valuenow',state.scene+1);$('#progressFill').style.width=((state.scene+1)/scenes.length*100)+'%';$('#liveStatus').textContent=`Scene ${state.scene+1}: ${s.title}`;bind()}
function stop(){clearInterval(tokenizationTimer);tokenizationTimer=null;clearInterval(vocabBuildTimer);vocabBuildTimer=null}function move(d){stop();if(state.scene===scenes.length-1&&d>0)state.scene=0;else state.scene=Math.max(0,Math.min(scenes.length-1,state.scene+d));render()}$('#prevBtn').onclick=()=>move(-1);$('#nextBtn').onclick=()=>move(1);$('#restartBtn').onclick=()=>{stop();state.scene=0;state.rnnStep=0;state.evolveStep=0;render()};document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});render();
document.addEventListener('click',e=>{if(!e.target.closest('#prevBtn,#nextBtn,#restartBtn'))return;clearInterval(mapBuildTimer);mapBuildTimer=null;clearTimeout(trainingTimer);trainingTimer=null});
document.addEventListener('click',e=>{const chapter=e.target.closest('[data-chapter]');if(!chapter)return;stop();clearInterval(mapBuildTimer);mapBuildTimer=null;clearTimeout(trainingTimer);trainingTimer=null;const target=scenes.findIndex(scene=>scene.chapter===Number(chapter.dataset.chapter));if(target>=0){state.scene=target;render()}});
document.addEventListener('click',e=>{if(!e.target.closest('#rnnNext'))return;e.stopImmediatePropagation();state.rnnStep=Math.min(7,state.rnnStep+1);render()},true);
</script>
